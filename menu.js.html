  function parseConfDate(val) {
    if (!val) return null;
    if (val instanceof Date) {
      return isNaN(val.getTime()) ? null : new Date(val.getFullYear(), val.getMonth(), val.getDate());
    }
    const s = String(val).trim();
    if (!s) return null;
    // YYYY-MM-DD
    let m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
    if (m) {
      return new Date(parseInt(m[1], 10), parseInt(m[2], 10) - 1, parseInt(m[3], 10));
    }
    // DD-MM-YYYY or MM-DD-YYYY
    m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/);
    if (m) {
      const p1 = parseInt(m[1], 10);
      const p2 = parseInt(m[2], 10);
      const yr = parseInt(m[3], 10);
      if (p1 > 12) {
        return new Date(yr, p2 - 1, p1);
      }
      const d = new Date(yr, p1 - 1, p2);
      if (!isNaN(d.getTime())) return d;
    }
    const fallback = new Date(s);
    return isNaN(fallback.getTime()) ? null : new Date(fallback.getFullYear(), fallback.getMonth(), fallback.getDate());
  }

  function getConfName(r) {
    if (!r) return '';
    return String(r['conference name'] || r['Conference Name'] || r['conferencename'] || r.conference_name || r.name || '').trim();
  }

  function getConfPax(r) {
    if (!r) return 0;
    const raw = String(r.pax || r.Pax || '').replace(/[^0-9.]/g, '');
    return Number(raw) || 0;
  }

  function populateCategoryFilter() {
    const catSelect = document.getElementById('menuCatFilter');
    if (!catSelect) return;
    const currentVal = categoryFilter;
    const catSet = new Set();
    DEFAULT_CATEGORIES.forEach(c => catSet.add(c));
    if (Array.isArray(categoryOptions)) {
      categoryOptions.forEach(c => {
        const name = String(c['Categories name'] || c['categories name'] || c.name || '').trim();
        if (name) catSet.add(name);
      });
    }
    records.forEach(r => {
      const p = parseMenuData(r.menu);
      p.categories.forEach(c => {
        const name = String(c.name || '').trim();
        if (name) catSet.add(name);
      });
    });

    let html = '<option value="all">All Categories</option>';
    Array.from(catSet).sort().forEach(c => {
      html += `<option value="${App.esc(c)}">${App.esc(c)}</option>`;
    });
    catSelect.innerHTML = html;
    catSelect.value = currentVal;
  }

    const sortSelect = document.getElementById('menuSortOrder');
    const resetBtn = document.getElementById('menuResetFiltersBtn');

        render();

    if (clearBtn) {
      clearBtn.onclick = () => {
        if (searchInput) {
          searchInput.value = '';

        page = 1;
        render();
      };
    }

    if (timelineSelect) {
      timelineSelect.onchange = (e) => {
        timelineFilter = e.target.value;
        page = 1;
        render();
      };
    }

    if (monthSelect) {
      monthSelect.onchange = (e) => {
        monthFilter = e.target.value;
        page = 1;
        render();
      };
    }

    if (catSelect) {
      catSelect.onchange = (e) => {

        page = 1;
        render();
      };

    if (resetBtn) {

        monthFilter = 'all';
        categoryFilter = 'all';
        paxFilter = 'all';
        statusFilter = 'all';
        sortOrder = 'date_asc';
        page = 1;

        if (searchInput) searchInput.value = '';
        if (clearBtn) clearBtn.style.display = 'none';
        if (timelineSelect) timelineSelect.value = 'all';
        if (monthSelect) monthSelect.value = 'all';
        if (catSelect) catSelect.value = 'all';
        if (paxSelect) paxSelect.value = 'all';
        if (statusSelect) statusSelect.value = 'all';

      google.script.run

          categoryOptions = data || [];
          populateCategoryFilter();

        .withFailureHandler(() => { categoryOptions = []; })

      google.script.run
        .withSuccessHandler(data => { mealOptions = data || []; })
        .withFailureHandler(() => { mealOptions = []; })
        .getMeals();

      google.script.run
        .withSuccessHandler(data => { itemOptions = data || []; })
        .withFailureHandler(() => { itemOptions = []; })
        .getItems();
    }
  }

  function getMasterDishItems() {
    const list = [];
    const seen = new Set();

    (mealOptions || []).forEach(it => {
      const name = String(it['Meal Name'] || it['meal name'] || it.Meal || it.meal || it['Items Name'] || it.name || '').trim();
      if (name && !seen.has(name.toLowerCase())) {
        seen.add(name.toLowerCase());
        list.push(name);
      }
    });

    const defaults = [
      'Spicy Chicken Wings', 'Grilled Fish in Lemon Herb', 'Sword Fish Fillet',
      'Beef Stew', 'Fried Rice', 'Jollof Rice', 'Steamed Jasmine Rice',
      'Mixed Green Salad', 'Coleslaw', 'Fresh Fruit Platter', 'Chocolate Cake',
      'Spring Rolls', 'Samosas', 'Garlic Bread', 'Plantain (Dodo)',
      'Roast Potatoes', 'Assorted Meat Platter', 'Fish in Herb Sauce',
      'Vegetable Stir Fry', 'Pepper Soup'
    ];
    defaults.forEach(name => {
      if (!seen.has(name.toLowerCase())) {
        seen.add(name.toLowerCase());
        list.push(name);
      }
    });

    return list;
  }

    (itemOptions || []).forEach(it => {

      'Curry Powder', 'Dried Thyme', 'White Pepper', 'Black Pepper',

      'Heavy Cream', 'Soy Sauce', 'Chili Flakes', 'Bell Pepper Mix'

  function formatIngredientsTotal(ingredients) {
    let totalKg = 0;
    let pcs = 0;
    let packs = 0;
    let liters = 0;
    let count = 0;

    (ingredients || []).forEach(ing => {
      if (!ing || !ing.name || !String(ing.name).trim()) return;
      count++;
      const rawVal = parseFloat(String(ing.weight || '').replace(/[^0-9.]/g, ''));
      if (isNaN(rawVal) || rawVal <= 0) return;
      const unit = String(ing.unit || 'kg').toLowerCase().trim();

      if (unit === 'kg') {
        totalKg += rawVal;
      } else if (unit === 'g' || unit === 'gms') {
        totalKg += (rawVal / 1000);
      } else if (unit === 'lbs') {
        totalKg += (rawVal * 0.45359237);
      } else if (unit === 'pcs') {
        pcs += rawVal;
      } else if (unit === 'packs') {
        packs += rawVal;
      } else if (unit === 'l' || unit === 'litres' || unit === 'liter') {
        liters += rawVal;
      } else if (unit === 'ml') {
        liters += (rawVal / 1000);
      } else {
        totalKg += rawVal;
      }
    });

    const parts = [];
    if (totalKg > 0) {
      const formattedKg = Number(totalKg.toFixed(2)).toString();
      parts.push(`${formattedKg} kg`);
    }
    if (liters > 0) {
      const formattedL = Number(liters.toFixed(2)).toString();
      parts.push(`${formattedL} L`);
    }
    if (pcs > 0) {
      parts.push(`${pcs} pcs`);
    }
    if (packs > 0) {
      parts.push(`${packs} packs`);
    }

    const primaryStr = parts.length > 0 ? parts.join(' &bull; ') : '0 kg';
    return {
      count,
      primaryStr,
      totalKg: Number(totalKg.toFixed(2)),
      parts
    };
  }

  function setupCombobox(boxEl, inputEl, optionsGetter, onSelect) {
    if (!boxEl || !inputEl) return;
    const menuEl = boxEl.querySelector('.combobox-menu');
    const arrowBtn = boxEl.querySelector('.combobox-arrow-btn');
    let activeIndex = -1;

    function closeMenu() {
      if (menuEl) menuEl.classList.remove('open');
      boxEl.classList.remove('is-open');
      activeIndex = -1;
    }

    function renderList(query) {
      if (!menuEl) return;
      const rawOptions = (typeof optionsGetter === 'function' ? optionsGetter() : optionsGetter) || [];
      const q = (query || '').trim().toLowerCase();

      const filtered = q
        ? rawOptions.filter(opt => String(opt).toLowerCase().includes(q))
        : rawOptions;

      if (filtered.length === 0) {
        menuEl.innerHTML = `<div class="combobox-menu-empty">No exact matches &bull; Press Enter to use "${App.esc(query)}"</div>`;
      } else {
        menuEl.innerHTML = filtered.slice(0, 50).map((opt, i) => {
          let label = App.esc(opt);
          if (q) {
            const matchIdx = opt.toLowerCase().indexOf(q);
            if (matchIdx !== -1) {
              const before = opt.substring(0, matchIdx);
              const match = opt.substring(matchIdx, matchIdx + q.length);
              const after = opt.substring(matchIdx + q.length);
              label = `${App.esc(before)}<mark>${App.esc(match)}</mark>${App.esc(after)}`;
            }
          }
          return `<div class="combobox-menu-item" data-index="${i}" data-val="${App.esc(opt)}"><span>${label}</span></div>`;
        }).join('');

        menuEl.querySelectorAll('.combobox-menu-item').forEach(item => {
          item.onmousedown = (e) => {
            e.preventDefault();
            const val = item.dataset.val;
            inputEl.value = val;
            closeMenu();
            if (typeof onSelect === 'function') onSelect(val);
          };
        });
      }

      menuEl.classList.add('open');
      boxEl.classList.add('is-open');
      activeIndex = -1;
    }

    inputEl.addEventListener('focus', () => {
      document.querySelectorAll('.combobox-menu.open').forEach(m => {
        if (m !== menuEl) {
          m.classList.remove('open');
          m.closest('.searchable-combobox')?.classList.remove('is-open');
        }
      });
      renderList(inputEl.value);
    });

    inputEl.addEventListener('input', () => {
      renderList(inputEl.value);
    });

    inputEl.addEventListener('keydown', (e) => {
      const items = menuEl ? menuEl.querySelectorAll('.combobox-menu-item') : [];
      if (!menuEl || !menuEl.classList.contains('open')) {
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          renderList(inputEl.value);
          e.preventDefault();
        }
        return;
      }

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (items.length === 0) return;
        activeIndex = (activeIndex + 1) % items.length;
        items.forEach((it, idx) => it.classList.toggle('active', idx === activeIndex));
        items[activeIndex]?.scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (items.length === 0) return;
        activeIndex = (activeIndex - 1 + items.length) % items.length;
        items.forEach((it, idx) => it.classList.toggle('active', idx === activeIndex));
        items[activeIndex]?.scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter') {
        if (activeIndex >= 0 && items[activeIndex]) {
          e.preventDefault();
          const val = items[activeIndex].dataset.val;
          inputEl.value = val;
          closeMenu();
          if (typeof onSelect === 'function') onSelect(val);
        } else {
          closeMenu();
        }
      } else if (e.key === 'Escape') {
        e.preventDefault();
        closeMenu();
      } else if (e.key === 'Tab') {
        closeMenu();
      }
    });

    if (arrowBtn) {
      arrowBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (menuEl && menuEl.classList.contains('open')) {
          closeMenu();
        } else {
          inputEl.focus();
          renderList('');
        }
      });
    }
  }

  // Global document listener for closing comboboxes on outside click
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.searchable-combobox')) {
      document.querySelectorAll('.combobox-menu.open').forEach(m => {
        m.classList.remove('open');
        m.closest('.searchable-combobox')?.classList.remove('is-open');
      });
    }
  });

  function getTableWrap() {
    ensurePageMarkup();
    let wrap = document.getElementById('menuTableWrap');
    if (!wrap) {
      const pageEl = document.getElementById('page-menu');
      if (pageEl) {
        wrap = pageEl.querySelector('#menuTableWrap');
      }
    }
    return wrap;
  }

  function load() {
    updateControls();
    const wrap = getTableWrap();
    if (!wrap) return;
    wrap.innerHTML = '<div class="loading"><div class="spinner"></div>Loading conferences...</div>';
    google.script.run
      .withSuccessHandler(data => {
        records = data || [];
        populateCategoryFilter();
        render();
      })
      .withFailureHandler(err => {
        if (wrap) wrap.innerHTML = `<div class="empty-state" style="color:var(--danger)">${App.esc(err.message)}</div>`;
      })
      .getMenuRecords();
  }

  function parseMenuData(rawMenu) {
    if (!rawMenu) {
      return { categories: [], ingredients: [] };
    }
    if (typeof rawMenu === 'object') {
      return {
        categories: Array.isArray(rawMenu.categories) ? rawMenu.categories : [],
        ingredients: Array.isArray(rawMenu.ingredients) ? rawMenu.ingredients : []
      };
    }
    const str = String(rawMenu).trim();
    if (str.startsWith('{') && str.endsWith('}')) {
      try {
        const parsed = JSON.parse(str);
        return {
          categories: Array.isArray(parsed.categories) ? parsed.categories : [],
          ingredients: Array.isArray(parsed.ingredients) ? parsed.ingredients : []
        };
      } catch (e) {}
    }
    // Legacy plain text fallback
    return {
      categories: [
        {
          name: 'MENU ITEMS',
          items: str.split(',').map(s => ({
            name: s.trim(),
            pcs: '',
            weight: '',
            unit: 'kg',
            notes: ''
          })).filter(x => x.name)
        }
      ],
      ingredients: []
    };
  }

  function getFilteredAndSorted() {
    const q = searchQuery.toLowerCase();
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

    let list = records.filter(r => {
      const confDate = parseConfDate(r.date);

      // Timeline filter
      if (timelineFilter !== 'all') {
        if (!confDate) return false;
        const dTime = confDate.getTime();
        const tTime = today.getTime();

        if (timelineFilter === 'today') {
          if (dTime !== tTime) return false;
        } else if (timelineFilter === 'upcoming') {
          if (dTime < tTime) return false;
        } else if (timelineFilter === 'past') {
          if (dTime >= tTime) return false;
        } else if (timelineFilter === 'this_month') {
          if (confDate.getFullYear() !== today.getFullYear() || confDate.getMonth() !== today.getMonth()) {
            return false;
          }
        } else if (timelineFilter === 'this_week') {
          const day = today.getDay();
          const startOfWeek = new Date(today);
          startOfWeek.setDate(today.getDate() - day);
          const endOfWeek = new Date(startOfWeek);
          endOfWeek.setDate(startOfWeek.getDate() + 6);
          if (dTime < startOfWeek.getTime() || dTime > endOfWeek.getTime()) return false;
        }
      }

      // Month filter
      if (monthFilter !== 'all') {
        if (!confDate) return false;
        if (confDate.getMonth() !== parseInt(monthFilter, 10)) return false;
      }

      // Category filter
      if (categoryFilter !== 'all') {
        const parsed = parseMenuData(r.menu);
        const target = categoryFilter.toLowerCase();
        const hasCategory = parsed.categories.some(c => String(c.name || '').trim().toLowerCase() === target);
        if (!hasCategory) return false;
      }

      // Pax filter
      if (paxFilter !== 'all') {
        const pax = getConfPax(r);
        if (paxFilter === 'small' && pax >= 50) return false;
        if (paxFilter === 'medium' && (pax < 50 || pax > 150)) return false;
        if (paxFilter === 'large' && pax <= 150) return false;
      }

      // Status filter
      if (statusFilter !== 'all') {
        const st = String(r.status || 'Pending').trim().toLowerCase();
        const isApproved = st === 'approved';
        if (statusFilter === 'approved' && !isApproved) return false;
        if (statusFilter === 'pending' && isApproved) return false;
      }

      // Text search
      if (q) {
        const confName = getConfName(r);
        const mid = String(r.mid || r.MID || r.id || '');
        const remarks = String(r.remarks || r.Remarks || '');
        const menuStr = typeof r.menu === 'string' ? r.menu : JSON.stringify(r.menu || '');
        const dateStr = String(r.date || '');
        const paxStr = String(r.pax || '');
        const haystack = [confName, mid, remarks, menuStr, dateStr, paxStr].join(' ').toLowerCase();
        if (!haystack.includes(q)) return false;
      }

      return true;
    });

    // Sort list
    list.sort((a, b) => {
      const dateAObj = parseConfDate(a.date);
      const dateBObj = parseConfDate(b.date);
      const dateA = dateAObj ? dateAObj.getTime() : 0;
      const dateB = dateBObj ? dateBObj.getTime() : 0;
      const nameA = getConfName(a).toLowerCase();
      const nameB = getConfName(b).toLowerCase();
      const paxA = getConfPax(a);
      const paxB = getConfPax(b);
      const idA = String(a.mid || a.MID || a.id || '');
      const idB = String(b.mid || b.MID || b.id || '');

      switch (sortOrder) {
        case 'date_desc':
          return dateB - dateA;
        case 'name_asc':
          return nameA.localeCompare(nameB);
        case 'pax_desc':
          return paxB - paxA;
        case 'pax_asc':
          return paxA - paxB;
        case 'id_desc':
          return idB.localeCompare(idA, undefined, { numeric: true });
        case 'date_asc':
        default:
          return dateA - dateB;
      }
    });

    return list;
  }

  function getDayOfWeek(dateStr) {
    if (!dateStr) return '';
    try {
      const parts = dateStr.split('-');
      if (parts.length === 3) {
        const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
        return d.toLocaleDateString('en-US', { weekday: 'long' }).toUpperCase();
      }
    } catch (e) {}
    return '';
  }

  function formatDisplayDate(dateVal) {
    if (!dateVal) return '';
    try {
      const d = new Date(dateVal);
      if (isNaN(d.getTime())) return String(dateVal);
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yyyy = d.getFullYear();
      return `${dd}/${mm}/${yyyy}`;
    } catch (e) {
      return String(dateVal);
    }
  }

    // Helper: Sum & Combine Duplicate Ingredients
    function mergeDuplicateIngredients() {
      const map = new Map();
      let mergedCount = 0;

      stateIngredients.forEach(ing => {
        const name = String(ing.name || '').trim();
        if (!name) return;
        const key = name.toLowerCase();

        const rawVal = parseFloat(String(ing.weight || '').replace(/[^0-9.]/g, ''));
        const val = isNaN(rawVal) ? 0 : rawVal;
        const unit = String(ing.unit || 'kg').toLowerCase().trim();

        if (map.has(key)) {
          mergedCount++;
          const existing = map.get(key);
          const exUnit = String(existing.unit || 'kg').toLowerCase().trim();
          let exVal = parseFloat(String(existing.weight || 0)) || 0;

          if (exUnit === unit) {
            existing.weight = Number((exVal + val).toFixed(2)).toString();
          } else if (exUnit === 'kg' && (unit === 'g' || unit === 'gms')) {
            existing.weight = Number((exVal + (val / 1000)).toFixed(2)).toString();
          } else if ((exUnit === 'g' || exUnit === 'gms') && unit === 'kg') {
            existing.unit = 'kg';
            existing.weight = Number(((exVal / 1000) + val).toFixed(2)).toString();
          } else {
            existing.weight = Number((exVal + val).toFixed(2)).toString();
          }
        } else {
          map.set(key, {
            name: name,
            weight: val > 0 ? Number(val.toFixed(2)).toString() : String(ing.weight || ''),
            unit: ing.unit || 'kg'
          });
        }
      });

      if (mergedCount === 0) {
        App.toast('No duplicate ingredients found to sum.', 'info');
        return;
      }

      stateIngredients = Array.from(map.values());
      renderIngredients();
      App.toast(`Combined and summed ${mergedCount} duplicate ingredient line(s)!`, 'success');
    }

            <button type="button" class="combobox-arrow-btn" tabindex="-1" title="Show suggestions"><i class="fa-solid fa-chevron-down"></i></button>
            <div class="combobox-menu"></div>
          </div>
          <input type="text" class="ing-weight" placeholder="Weight/qty (e.g. 1.5)" value="${App.esc(ing.weight)}">
          <select class="ing-unit">
            <option value="kg" ${ing.unit === 'kg' ? 'selected' : ''}>kg</option>
            <option value="gms" ${ing.unit === 'gms' ? 'selected' : ''}>gms</option>
            <option value="g" ${ing.unit === 'g' ? 'selected' : ''}>g</option>
            <option value="pcs" ${ing.unit === 'pcs' ? 'selected' : ''}>pcs</option>
            <option value="packs" ${ing.unit === 'packs' ? 'selected' : ''}>packs</option>
            <option value="L" ${ing.unit === 'L' ? 'selected' : ''}>L</option>
          </select>
          <button type="button" class="btn-remove-row" data-del-ing="${idx}" title="Remove ingredient">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        </div>
      `).join('');

      bindIngredientEvents();
      updateIngredientsTotal();
    }

    function bindIngredientEvents() {
      backdrop.querySelectorAll('.ingredient-row').forEach(row => {
        const idx = Number(row.dataset.ingIdx);
        const box = row.querySelector('.searchable-combobox');
        const nameInput = row.querySelector('.ing-name');
        const weightInput = row.querySelector('.ing-weight');
        const unitSelect = row.querySelector('.ing-unit');

        nameInput.oninput = (e) => {
          stateIngredients[idx].name = e.target.value;
          updateIngredientsTotal();
        };

        setupCombobox(box, nameInput, getMasterIngredientItems, (val) => {
          stateIngredients[idx].name = val;
          updateIngredientsTotal();
        });

        weightInput.oninput = (e) => {
          stateIngredients[idx].weight = e.target.value;
          updateIngredientsTotal();
        };

        unitSelect.onchange = (e) => {
          stateIngredients[idx].unit = e.target.value;
          updateIngredientsTotal();
        };
      });

      backdrop.querySelectorAll('[data-del-ing]').forEach(btn => {
        btn.onclick = () => {
          const idx = Number(btn.dataset.delIng);
          stateIngredients.splice(idx, 1);
          renderIngredients();
        };
      });

      const sumDuplicatesBtn = backdrop.querySelector('#builderSumDuplicatesBtn');
      if (sumDuplicatesBtn) {
        sumDuplicatesBtn.onclick = mergeDuplicateIngredients;
      }
    }

    // Add category button
    backdrop.querySelector('#builderAddCategoryBtn').onclick = () => {
      stateCategories.push({
        name: 'NEW CATEGORY',
        items: [{ name: '', pcs: '', weight: '', unit: 'kg', notes: '' }]
      });
      renderCategories();
    };

    // Add ingredient button
    backdrop.querySelector('#builderAddIngredientBtn').onclick = () => {
      stateIngredients.push({ name: '', weight: '', unit: 'kg' });
      renderIngredients();
    };

    // Initial renders
    renderCategories();
    renderIngredients();

    // Save Action
    backdrop.querySelector('#builderSaveBtn').onclick = () => {
      const confName = backdrop.querySelector('#builderConfName').value.trim();
      const confDate = backdrop.querySelector('#builderConfDate').value;
      const confPax = backdrop.querySelector('#builderConfPax').value.trim();
      const confRemarks = backdrop.querySelector('#builderConfRemarks').value.trim();

      if (!confName) {
        App.toast('Please enter the Conference / Event Name.', 'error');
        backdrop.querySelector('#builderConfName').focus();
        return;
      }

      // Filter empty items
      const cleanCategories = stateCategories
        .map(cat => ({
          name: cat.name.trim(),
          items: (cat.items || []).filter(it => it.name && it.name.trim())
        }))
        .filter(cat => cat.name || cat.items.length > 0);

      // Filter empty ingredients
      const cleanIngredients = stateIngredients.filter(ing => ing.name && ing.name.trim());

      const structuredMenu = {
        categories: cleanCategories,
        ingredients: cleanIngredients
      };

      const confStatusSelect = backdrop.querySelector('#builderConfStatus');
      const confStatus = confStatusSelect ? confStatusSelect.value : (record ? (record.status || 'Pending') : 'Pending');

      const payload = {
        'conference name': confName,
        date: confDate || '',
        pax: confPax || '',
        status: confStatus,
        remarks: confRemarks || '',
        menu: JSON.stringify(structuredMenu)
      };

      const saveBtn = backdrop.querySelector('#builderSaveBtn');
      saveBtn.disabled = true;
      saveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';

      if (isEdit) {
        google.script.run
          .withSuccessHandler(() => {
            App.toast('Conference menu updated successfully.');
            close();
            load();
            App.refreshNotifications();
          })
          .withFailureHandler((err) => {
            saveBtn.disabled = false;
            saveBtn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Save Conference Menu';
            App.toast(err && err.message ? err.message : 'Failed to update menu', 'error');
          })
          .updateMenu(record.mid, payload);
      } else {
        google.script.run
          .withSuccessHandler(() => {
            App.toast('Conference menu created successfully.');
            close();
            load();
            App.refreshNotifications();
          })
          .withFailureHandler((err) => {
            saveBtn.disabled = false;
            saveBtn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Save Conference Menu';
            App.toast(err && err.message ? err.message : 'Failed to create menu', 'error');
          })
          .createMenu(payload);
      }
    };
  }

  function downloadConferencePdf(mid, btnEl) {
    if (!mid) return;
    const originalHtml = btnEl ? btnEl.innerHTML : '';
    if (btnEl) {
      btnEl.disabled = true;
      btnEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Generating PDF...';
    }

    google.script.run
      .withSuccessHandler(res => {
        if (btnEl) {
          btnEl.disabled = false;
          btnEl.innerHTML = originalHtml;
        }
        if (!res || !res.base64) {
          App.toast('Failed to generate PDF document.', 'error');
          return;
        }

        try {
          const byteCharacters = atob(res.base64);
          const byteNumbers = new Array(byteCharacters.length);
          for (let i = 0; i < byteCharacters.length; i++) {
            byteNumbers[i] = byteCharacters.charCodeAt(i);
          }
          const byteArray = new Uint8Array(byteNumbers);
          const blob = new Blob([byteArray], { type: 'application/pdf' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = res.filename || `Production_Sheet_${mid}.pdf`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 2000);
          App.toast('Production sheet PDF downloaded.');
        } catch (e) {
          const a = document.createElement('a');
          a.href = 'data:application/pdf;base64,' + res.base64;
          a.download = res.filename || `Production_Sheet_${mid}.pdf`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          App.toast('Production sheet PDF downloaded.');
        }
      })
      .withFailureHandler(err => {
        if (btnEl) {
          btnEl.disabled = false;
          btnEl.innerHTML = originalHtml;
        }
        App.toast(err && err.message ? err.message : 'Error generating PDF.', 'error');
      })
      .downloadProductionSheetPdf(mid);
  }

  function remove(id) {
    if (!App.can('menu.delete')) {
      App.toast('Permission denied: You cannot delete conference records.', 'error');
      return;
    }
    if (!window.confirm('Delete this conference record?')) return;
    google.script.run
      .withSuccessHandler(() => { App.toast('Conference deleted'); load(); App.refreshNotifications(); })
      .withFailureHandler(err => App.toast(err.message, 'error'))
      .deleteMenu(id);
  }

  return { init, onShow, load, openMenuBuilder, openProductionSheet, approveConference, downloadConferencePdf };
