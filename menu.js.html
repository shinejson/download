<script>
var Pages = window.Pages = window.Pages || {};
Pages.menu = (function () {
  let records = [];
  let categoryOptions = [];
  let itemOptions = [];
  let page = 1;
  let pageSize = 10;
  let searchQuery = '';
  let timelineFilter = 'all';
  let monthFilter = 'all';
  let categoryFilter = 'all';
  let paxFilter = 'all';
  let statusFilter = 'all';
  let sortOrder = 'date_asc';

  const DEFAULT_CATEGORIES = [
    'STARTER',
    'MAIN DISH',
    'SIDE DISH',
    'DESERT',
    'SIDE ORDERS (A LA CARTE)'
  ];

  function parseConfDate(val) {
    if (!val) return null;
    if (val instanceof Date) {
      return isNaN(val.getTime()) ? null : new Date(val.getFullYear(), val.getMonth(), val.getDate());
    }
    const s = String(val).trim();
    if (!s) return null;
    // YYYY-MM-DD
    let m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
    if (m) {
      return new Date(parseInt(m[1], 10), parseInt(m[2], 10) - 1, parseInt(m[3], 10));
    }
    // DD-MM-YYYY or MM-DD-YYYY
    m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/);
    if (m) {
      const p1 = parseInt(m[1], 10);
      const p2 = parseInt(m[2], 10);
      const yr = parseInt(m[3], 10);
      if (p1 > 12) {
        return new Date(yr, p2 - 1, p1);
      }
      const d = new Date(yr, p1 - 1, p2);
      if (!isNaN(d.getTime())) return d;
    }
    const fallback = new Date(s);
    return isNaN(fallback.getTime()) ? null : new Date(fallback.getFullYear(), fallback.getMonth(), fallback.getDate());
  }

  function getConfName(r) {
    if (!r) return '';
    return String(r['conference name'] || r['Conference Name'] || r['conferencename'] || r.conference_name || r.name || '').trim();
  }

  function getConfPax(r) {
    if (!r) return 0;
    const raw = String(r.pax || r.Pax || '').replace(/[^0-9.]/g, '');
    return Number(raw) || 0;
  }

  function ensurePageMarkup() {
    const pageEl = document.getElementById('page-menu');
    if (!pageEl) return;

    const addBtn = document.getElementById('menuAddBtn');
    const wrap = document.getElementById('menuTableWrap');
    const searchInput = document.getElementById('menuSearchInput');

    if (!addBtn || !wrap || !searchInput) {
      pageEl.innerHTML = `
<div class="card">
  <div class="card-header-bar">
    <h3><i class="fa-solid fa-calendar-days"></i> Conference Records</h3>
    <button class="btn btn-primary" id="menuAddBtn" type="button">
      <i class="fa-solid fa-plus"></i> Add Conference
    </button>
  </div>

  <div class="advanced-filter-bar">
    <div class="filter-group-main">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" class="search-input" id="menuSearchInput" placeholder="Search by conference name, menu items, remarks, or ID...">
        <button class="search-clear-btn" id="menuSearchClearBtn" type="button" style="display:none;" title="Clear search" aria-label="Clear search">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>

    <div class="filter-group-controls">
      <label class="filter-control">
        <i class="fa-solid fa-clock"></i> Timeline:
        <select class="filter-select" id="menuTimelineFilter" aria-label="Filter by timeline">
          <option value="all">All Conferences</option>
          <option value="today">Today</option>
          <option value="this_week">This Week</option>
          <option value="this_month">This Month</option>
          <option value="upcoming">Upcoming (Future)</option>
          <option value="past">Past</option>
        </select>
      </label>

      <label class="filter-control">
        <i class="fa-solid fa-calendar"></i> Month:
        <select class="filter-select" id="menuMonthFilter" aria-label="Filter by month">
          <option value="all">All Months</option>
          <option value="0">January</option>
          <option value="1">February</option>
          <option value="2">March</option>
          <option value="3">April</option>
          <option value="4">May</option>
          <option value="5">June</option>
          <option value="6">July</option>
          <option value="7">August</option>
          <option value="8">September</option>
          <option value="9">October</option>
          <option value="10">November</option>
          <option value="11">December</option>
        </select>
      </label>

      <label class="filter-control">
        <i class="fa-solid fa-layer-group"></i> Category:
        <select class="filter-select" id="menuCatFilter" aria-label="Filter by category">
          <option value="all">All Categories</option>
        </select>
      </label>

      <label class="filter-control">
        <i class="fa-solid fa-users-between-lines"></i> Pax Size:
        <select class="filter-select" id="menuPaxFilter" aria-label="Filter by pax size">
          <option value="all">All Group Sizes</option>
          <option value="small">Small (&lt; 50 pax)</option>
          <option value="medium">Medium (50 &ndash; 150 pax)</option>
          <option value="large">Large (&gt; 150 pax)</option>
        </select>
      </label>

      <label class="filter-control">
        <i class="fa-solid fa-circle-check"></i> Status:
        <select class="filter-select" id="menuStatusFilter" aria-label="Filter by status">
          <option value="all">All Statuses</option>
          <option value="approved">Approved</option>
          <option value="pending">Pending Approval</option>
        </select>
      </label>

      <label class="filter-control">
        <i class="fa-solid fa-arrow-down-a-z"></i> Sort:
        <select class="filter-select" id="menuSortOrder" aria-label="Sort conferences">
          <option value="date_asc">Date (Earliest First)</option>
          <option value="date_desc">Date (Latest First)</option>
          <option value="name_asc">Conference Name (A &rarr; Z)</option>
          <option value="pax_desc">Pax (Highest First)</option>
          <option value="pax_asc">Pax (Lowest First)</option>
          <option value="id_desc">Newest First</option>
        </select>
      </label>

      <button type="button" class="btn btn-secondary btn-sm" id="menuResetFiltersBtn" title="Reset all filters">
        <i class="fa-solid fa-arrow-rotate-left"></i> Reset
      </button>
    </div>
  </div>

  <div id="menuTableWrap">
    <div class="loading"><div class="spinner"></div>Loading conferences...</div>
  </div>
</div>`;
      bindEvents();
    }
  }

  function populateCategoryFilter() {
    const catSelect = document.getElementById('menuCatFilter');
    if (!catSelect) return;
    const currentVal = categoryFilter;
    const catSet = new Set();
    DEFAULT_CATEGORIES.forEach(c => catSet.add(c));
    if (Array.isArray(categoryOptions)) {
      categoryOptions.forEach(c => {
        const name = String(c['Categories name'] || c['categories name'] || c.name || '').trim();
        if (name) catSet.add(name);
      });
    }
    records.forEach(r => {
      const p = parseMenuData(r.menu);
      p.categories.forEach(c => {
        const name = String(c.name || '').trim();
        if (name) catSet.add(name);
      });
    });

    let html = '<option value="all">All Categories</option>';
    Array.from(catSet).sort().forEach(c => {
      html += `<option value="${App.esc(c)}">${App.esc(c)}</option>`;
    });
    catSelect.innerHTML = html;
    catSelect.value = currentVal;
  }

  function bindEvents() {
    const addBtn = document.getElementById('menuAddBtn');
    if (addBtn) {
      addBtn.onclick = () => openMenuBuilder();
    }

    const searchInput = document.getElementById('menuSearchInput');
    const clearBtn = document.getElementById('menuSearchClearBtn');
    const timelineSelect = document.getElementById('menuTimelineFilter');
    const monthSelect = document.getElementById('menuMonthFilter');
    const catSelect = document.getElementById('menuCatFilter');
    const paxSelect = document.getElementById('menuPaxFilter');
    const statusSelect = document.getElementById('menuStatusFilter');
    const sortSelect = document.getElementById('menuSortOrder');
    const resetBtn = document.getElementById('menuResetFiltersBtn');

    if (searchInput) {
      searchInput.oninput = (e) => {
        searchQuery = e.target.value.trim();
        if (clearBtn) clearBtn.style.display = searchQuery ? 'inline-block' : 'none';
        page = 1;
        render();
      };
    }

    if (clearBtn) {
      clearBtn.onclick = () => {
        if (searchInput) {
          searchInput.value = '';
          searchInput.focus();
        }
        searchQuery = '';
        clearBtn.style.display = 'none';
        page = 1;
        render();
      };
    }

    if (timelineSelect) {
      timelineSelect.onchange = (e) => {
        timelineFilter = e.target.value;
        page = 1;
        render();
      };
    }

    if (monthSelect) {
      monthSelect.onchange = (e) => {
        monthFilter = e.target.value;
        page = 1;
        render();
      };
    }

    if (catSelect) {
      catSelect.onchange = (e) => {
        categoryFilter = e.target.value;
        page = 1;
        render();
      };
    }

    if (paxSelect) {
      paxSelect.onchange = (e) => {
        paxFilter = e.target.value;
        page = 1;
        render();
      };
    }

    if (statusSelect) {
      statusSelect.onchange = (e) => {
        statusFilter = e.target.value;
        page = 1;
        render();
      };
    }

    if (sortSelect) {
      sortSelect.onchange = (e) => {
        sortOrder = e.target.value;
        page = 1;
        render();
      };
    }

    if (resetBtn) {
      resetBtn.onclick = () => {
        searchQuery = '';
        timelineFilter = 'all';
        monthFilter = 'all';
        categoryFilter = 'all';
        paxFilter = 'all';
        statusFilter = 'all';
        sortOrder = 'date_asc';
        page = 1;

        if (searchInput) searchInput.value = '';
        if (clearBtn) clearBtn.style.display = 'none';
        if (timelineSelect) timelineSelect.value = 'all';
        if (monthSelect) monthSelect.value = 'all';
        if (catSelect) catSelect.value = 'all';
        if (paxSelect) paxSelect.value = 'all';
        if (statusSelect) statusSelect.value = 'all';
        if (sortSelect) sortSelect.value = 'date_asc';

        render();
      };
    }
  }

  function init() {
    ensurePageMarkup();
    bindEvents();
    populateCategoryFilter();
    loadMasterLookups();
  }

  function updateControls() {
    const addBtn = document.getElementById('menuAddBtn');
    if (addBtn) {
      addBtn.style.display = App.can('menu.create') ? '' : 'none';
    }
  }

  function onShow() {
    ensurePageMarkup();
    bindEvents();
    populateCategoryFilter();
    updateControls();
    loadMasterLookups();
    load();
  }

  function loadMasterLookups() {
    if (App.can('categories.view')) {
      google.script.run
        .withSuccessHandler(data => {
          categoryOptions = data || [];
          populateCategoryFilter();
        })
        .withFailureHandler(() => { categoryOptions = []; })
        .getCategories();
    }
    if (App.can('items.view')) {
      google.script.run
        .withSuccessHandler(data => { itemOptions = data || []; })
        .withFailureHandler(() => { itemOptions = []; })
        .getItems();
    }
  }

  function getTableWrap() {
    ensurePageMarkup();
    let wrap = document.getElementById('menuTableWrap');
    if (!wrap) {
      const pageEl = document.getElementById('page-menu');
      if (pageEl) {
        wrap = pageEl.querySelector('#menuTableWrap');
      }
    }
    return wrap;
  }

  function load() {
    updateControls();
    const wrap = getTableWrap();
    if (!wrap) return;
    wrap.innerHTML = '<div class="loading"><div class="spinner"></div>Loading conferences...</div>';
    google.script.run
      .withSuccessHandler(data => {
        records = data || [];
        populateCategoryFilter();
        render();
      })
      .withFailureHandler(err => {
        if (wrap) wrap.innerHTML = `<div class="empty-state" style="color:var(--danger)">${App.esc(err.message)}</div>`;
      })
      .getMenuRecords();
  }

  function parseMenuData(rawMenu) {
    if (!rawMenu) {
      return { categories: [], ingredients: [] };
    }
    if (typeof rawMenu === 'object') {
      return {
        categories: Array.isArray(rawMenu.categories) ? rawMenu.categories : [],
        ingredients: Array.isArray(rawMenu.ingredients) ? rawMenu.ingredients : []
      };
    }
    const str = String(rawMenu).trim();
    if (str.startsWith('{') && str.endsWith('}')) {
      try {
        const parsed = JSON.parse(str);
        return {
          categories: Array.isArray(parsed.categories) ? parsed.categories : [],
          ingredients: Array.isArray(parsed.ingredients) ? parsed.ingredients : []
        };
      } catch (e) {}
    }
    // Legacy plain text fallback
    return {
      categories: [
        {
          name: 'MENU ITEMS',
          items: str.split(',').map(s => ({
            name: s.trim(),
            pcs: '',
            weight: '',
            unit: 'kg',
            notes: ''
          })).filter(x => x.name)
        }
      ],
      ingredients: []
    };
  }

  function getFilteredAndSorted() {
    const q = searchQuery.toLowerCase();
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

    let list = records.filter(r => {
      const confDate = parseConfDate(r.date);

      // Timeline filter
      if (timelineFilter !== 'all') {
        if (!confDate) return false;
        const dTime = confDate.getTime();
        const tTime = today.getTime();

        if (timelineFilter === 'today') {
          if (dTime !== tTime) return false;
        } else if (timelineFilter === 'upcoming') {
          if (dTime < tTime) return false;
        } else if (timelineFilter === 'past') {
          if (dTime >= tTime) return false;
        } else if (timelineFilter === 'this_month') {
          if (confDate.getFullYear() !== today.getFullYear() || confDate.getMonth() !== today.getMonth()) {
            return false;
          }
        } else if (timelineFilter === 'this_week') {
          const day = today.getDay();
          const startOfWeek = new Date(today);
          startOfWeek.setDate(today.getDate() - day);
          const endOfWeek = new Date(startOfWeek);
          endOfWeek.setDate(startOfWeek.getDate() + 6);
          if (dTime < startOfWeek.getTime() || dTime > endOfWeek.getTime()) return false;
        }
      }

      // Month filter
      if (monthFilter !== 'all') {
        if (!confDate) return false;
        if (confDate.getMonth() !== parseInt(monthFilter, 10)) return false;
      }

      // Category filter
      if (categoryFilter !== 'all') {
        const parsed = parseMenuData(r.menu);
        const target = categoryFilter.toLowerCase();
        const hasCategory = parsed.categories.some(c => String(c.name || '').trim().toLowerCase() === target);
        if (!hasCategory) return false;
      }

      // Pax filter
      if (paxFilter !== 'all') {
        const pax = getConfPax(r);
        if (paxFilter === 'small' && pax >= 50) return false;
        if (paxFilter === 'medium' && (pax < 50 || pax > 150)) return false;
        if (paxFilter === 'large' && pax <= 150) return false;
      }

      // Status filter
      if (statusFilter !== 'all') {
        const st = String(r.status || 'Pending').trim().toLowerCase();
        const isApproved = st === 'approved';
        if (statusFilter === 'approved' && !isApproved) return false;
        if (statusFilter === 'pending' && isApproved) return false;
      }

      // Text search
      if (q) {
        const confName = getConfName(r);
        const mid = String(r.mid || r.MID || r.id || '');
        const remarks = String(r.remarks || r.Remarks || '');
        const menuStr = typeof r.menu === 'string' ? r.menu : JSON.stringify(r.menu || '');
        const dateStr = String(r.date || '');
        const paxStr = String(r.pax || '');
        const haystack = [confName, mid, remarks, menuStr, dateStr, paxStr].join(' ').toLowerCase();
        if (!haystack.includes(q)) return false;
      }

      return true;
    });

    // Sort list
    list.sort((a, b) => {
      const dateAObj = parseConfDate(a.date);
      const dateBObj = parseConfDate(b.date);
      const dateA = dateAObj ? dateAObj.getTime() : 0;
      const dateB = dateBObj ? dateBObj.getTime() : 0;
      const nameA = getConfName(a).toLowerCase();
      const nameB = getConfName(b).toLowerCase();
      const paxA = getConfPax(a);
      const paxB = getConfPax(b);
      const idA = String(a.mid || a.MID || a.id || '');
      const idB = String(b.mid || b.MID || b.id || '');

      switch (sortOrder) {
        case 'date_desc':
          return dateB - dateA;
        case 'name_asc':
          return nameA.localeCompare(nameB);
        case 'pax_desc':
          return paxB - paxA;
        case 'pax_asc':
          return paxA - paxB;
        case 'id_desc':
          return idB.localeCompare(idA, undefined, { numeric: true });
        case 'date_asc':
        default:
          return dateA - dateB;
      }
    });

    return list;
  }

  function render() {
    const wrap = getTableWrap();
    if (!wrap) return;

    const filtered = getFilteredAndSorted();
    const canEdit = App.can('menu.edit');
    const canDelete = App.can('menu.delete');

    const headers = [
      'MID',
      'Conference / Event',
      'Date & Day',
      'Pax',
      'Status',
      'Menu & Production Structure',
      'Remarks',
      'Actions'
    ];

    App.renderPaginatedTable({
      container: wrap,
      headers: headers,
      rows: filtered,
      page: page,
      pageSize: pageSize,
      emptyMsg: searchQuery || timelineFilter !== 'all' || monthFilter !== 'all' || categoryFilter !== 'all' || paxFilter !== 'all' || statusFilter !== 'all'
        ? 'No conferences match your filter criteria.'
        : 'No conference records found.',
      onPageChange: (newPage) => {
        page = newPage;
        render();
      },
      onPageSizeChange: (newSize) => {
        pageSize = newSize;
        page = 1;
        render();
      },
      rowRenderer: (r) => {
        const confName = getConfName(r);
        const d = parseConfDate(r.date);
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const isUpcoming = d && d.getTime() >= today.getTime();
        const dateFormatted = d ? App.fmtDate(d) : App.fmtDate(r.date);
        const dayName = d ? d.toLocaleDateString('en-US', { weekday: 'short' }).toUpperCase() : '';

        const rawStatus = String(r.status || 'Pending').trim();
        const isApproved = rawStatus.toLowerCase() === 'approved';
        const statusBadge = isApproved
          ? `<span class="role-badge" style="background:#dcfce7;color:#15803d;font-weight:600;font-size:11px;padding:3px 9px;"><i class="fa-solid fa-circle-check"></i> Approved</span>`
          : `<span class="role-badge" style="background:#fef3c7;color:#b45309;font-weight:600;font-size:11px;padding:3px 9px;"><i class="fa-solid fa-clock"></i> Pending</span>`;

        const parsed = parseMenuData(r.menu);
        const catCount = parsed.categories.length;
        const dishCount = parsed.categories.reduce((acc, c) => acc + (c.items ? c.items.length : 0), 0);
        const ingCount = parsed.ingredients.length;

        let menuSummaryHtml = '';
        if (catCount > 0 || ingCount > 0) {
          menuSummaryHtml = `
            <div style="display:flex;flex-direction:column;gap:4px;">
              <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                <span class="role-badge" style="background:#eff6ff;color:#2563eb;font-size:11px;padding:2px 8px;">
                  <i class="fa-solid fa-layer-group"></i> ${catCount} Categories
                </span>
                <span class="role-badge" style="background:#f0fdf4;color:#16a34a;font-size:11px;padding:2px 8px;">
                  <i class="fa-solid fa-utensils"></i> ${dishCount} Dishes
                </span>
                ${ingCount > 0 ? `
                  <span class="role-badge" style="background:#fef3c7;color:#d97706;font-size:11px;padding:2px 8px;">
                    <i class="fa-solid fa-carrot"></i> ${ingCount} Ingredients
                  </span>
                ` : ''}
              </div>
              <small style="color:var(--text-light);max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                ${App.esc(parsed.categories.map(c => c.name).filter(Boolean).join(', '))}
              </small>
            </div>
          `;
        } else {
          menuSummaryHtml = `<span style="color:var(--text-light);font-size:12px;">No dishes configured</span>`;
        }

        return `
          <tr>
            <td><code>${App.esc(r.mid)}</code></td>
            <td>
              <strong style="color:var(--text);font-size:13.5px;">${App.esc(confName || '—')}</strong>
            </td>
            <td>
              <div style="display:flex;flex-direction:column;gap:2px;">
                <span style="display:inline-flex;align-items:center;gap:5px;font-weight:500;">
                  <i class="fa-regular fa-calendar" style="color:var(--text-light);font-size:12px;"></i>
                  ${App.esc(dateFormatted || '—')}
                </span>
                <span style="font-size:11px;color:var(--text-light);font-weight:600;">
                  ${App.esc(dayName)} ${isUpcoming ? '<span style="font-size:10px;padding:1px 6px;border-radius:999px;background:#e0f2fe;color:#0369a1;margin-left:4px;">Upcoming</span>' : ''}
                </span>
              </div>
            </td>
            <td>
              <span style="font-weight:700;color:var(--text);font-size:13px;">${App.esc(r.pax || '—')}</span>
              ${r.pax ? '<span style="font-size:11px;color:var(--text-light);"> PAX</span>' : ''}
            </td>
            <td>${statusBadge}</td>
            <td>${menuSummaryHtml}</td>
            <td><small style="color:var(--text-light);">${App.esc(r.remarks || '—')}</small></td>
            <td class="actions-cell">
              <button class="btn btn-secondary btn-sm" data-sheet="${App.esc(r.mid)}" title="View/Print Production Sheet">
                <i class="fa-solid fa-file-invoice"></i> Sheet
              </button>
              <button class="btn btn-secondary btn-sm" data-download-pdf="${App.esc(r.mid)}" title="Download Production Sheet as PDF">
                <i class="fa-solid fa-file-arrow-down"></i> PDF
              </button>
              ${(!isApproved && (canEdit || (App.currentUser && App.currentUser.role === 'admin'))) ? `
                <button class="btn btn-success btn-sm" data-approve="${App.esc(r.mid)}" title="Approve this conference menu">
                  <i class="fa-solid fa-check"></i> Approve
                </button>
              ` : ''}
              ${canEdit ? `<button class="btn btn-secondary btn-sm" data-edit="${App.esc(r.mid)}" title="Edit conference menu"><i class="fa-solid fa-pen-to-square"></i> Edit</button>` : ''}
              ${canDelete ? `<button class="btn btn-danger btn-sm" data-del="${App.esc(r.mid)}" title="Delete conference"><i class="fa-solid fa-trash-can"></i></button>` : ''}
            </td>
          </tr>
        `;
      }
    });

    wrap.querySelectorAll('[data-sheet]').forEach(b => {
      b.onclick = () => openProductionSheet(records.find(x => String(x.mid) === b.dataset.sheet));
    });

    wrap.querySelectorAll('[data-download-pdf]').forEach(b => {
      b.onclick = () => downloadConferencePdf(b.dataset.downloadPdf, b);
    });

    wrap.querySelectorAll('[data-approve]').forEach(b => {
      b.onclick = () => approveConference(b.dataset.approve);
    });

    if (canEdit) {
      wrap.querySelectorAll('[data-edit]').forEach(b => {
        b.onclick = () => openMenuBuilder(records.find(x => String(x.mid) === b.dataset.edit));
      });
    }

    if (canDelete) {
      wrap.querySelectorAll('[data-del]').forEach(b => {
        b.onclick = () => remove(b.dataset.del);
      });
    }
  }

  function approveConference(id) {
    if (!App.can('menu.edit') && !(App.currentUser && App.currentUser.role === 'admin')) {
      App.toast('Permission denied: You cannot approve conference menus.', 'error');
      return;
    }
    if (!window.confirm('Approve this conference menu?')) return;
    google.script.run

  function getDayOfWeek(dateStr) {
    if (!dateStr) return '';
    try {
      const parts = dateStr.split('-');
      if (parts.length === 3) {
        const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
        return d.toLocaleDateString('en-US', { weekday: 'long' }).toUpperCase();
      }
    } catch (e) {}
    return '';
  }

  function formatDisplayDate(dateVal) {
    if (!dateVal) return '';
    try {
      const d = new Date(dateVal);
      if (isNaN(d.getTime())) return String(dateVal);
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yyyy = d.getFullYear();
      return `${dd}/${mm}/${yyyy}`;
    } catch (e) {
      return String(dateVal);
    }
  }

      } else {

          .withSuccessHandler(() => {
            App.toast('Conference menu created successfully.');

            App.refreshNotifications();

          .withFailureHandler((err) => {

            App.toast(err && err.message ? err.message : 'Failed to create menu', 'error');

          .withFailureHandler(err => {
            sheetApproveBtn.disabled = false;
            sheetApproveBtn.innerHTML = '<i class="fa-solid fa-check"></i> Approve Menu';
            App.toast(err && err.message ? err.message : 'Failed to approve menu', 'error');
          })
          .approveMenu(record.mid);
      };
    }

    // Download PDF button
    const sheetDownloadPdfBtn = backdrop.querySelector('#sheetDownloadPdfBtn');
    if (sheetDownloadPdfBtn) {
      sheetDownloadPdfBtn.onclick = () => {
        downloadConferencePdf(record.mid, sheetDownloadPdfBtn);
      };
    }

    // Print button: Isolated single-page A4 print
    backdrop.querySelector('#sheetPrintBtn').onclick = () => {
      triggerA4Print(record);
    };
  }

  function triggerA4Print(record) {
    const printArea = document.getElementById('productionSheetPrintArea');
    if (!printArea) {
      window.print();
      return;
    }

    const contentHtml = printArea.innerHTML;

    // Build standalone HTML for single A4 page print
    const printHtml = `<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Production Sheet - ${App.esc(getConfName(record) || 'Event')}</title>
  <style>
    @page {
      size: A4 portrait;
      margin: 8mm 10mm;
    }
    * {
      box-sizing: border-box;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 9.5pt;
      line-height: 1.25;
    }
    .production-sheet-card {
      width: 100%;
      max-width: 100%;
      margin: 0;
      padding: 0;
      page-break-inside: avoid;
      break-inside: avoid;
    }
    .sheet-brand-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #000;
      padding-bottom: 6px;
      margin-bottom: 8px;
    }
    .sheet-brand-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sheet-brand-logo-img {
      max-height: 36px;
      max-width: 100px;
      object-fit: contain;
    }
    .sheet-brand-name {
      font-size: 13pt;
      font-weight: 900;
      color: #000;
      letter-spacing: -0.01em;
      text-transform: uppercase;
    }
    .sheet-brand-sub {
      font-size: 8pt;
      color: #555;
    }
    .sheet-brand-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
    }
    .sheet-status-tag {
      display: inline-block;
      padding: 2px 8px;
      border: 1.5px solid #000;
      font-size: 8.5pt;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      border-radius: 4px;
    }
    .sheet-status-tag.approved {
      background: #dcfce7 !important;
      color: #15803d !important;
      border-color: #15803d !important;
    }
    .sheet-status-tag.pending {
      background: #fef3c7 !important;
      color: #b45309 !important;
      border-color: #b45309 !important;
    }
    .sheet-print-meta {
      font-size: 8pt;
      color: #555;
    }
    .sheet-header-title {
      font-size: 12.5pt;
      margin-bottom: 8px;
      font-weight: 900;
      text-decoration: underline;
      text-align: center;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .sheet-content-grid {
      display: grid;
      grid-template-columns: 1.55fr 1fr;
      gap: 14px;
      align-items: start;
    }
    .sheet-category-title {
      font-size: 10pt;
      font-weight: 900;
      margin: 5px 0 2px 0;
      border-bottom: 1.5px solid #000;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .sheet-dish-line {
      font-size: 9.5pt;
      line-height: 1.25;
      margin-bottom: 2px;
    }
    .sheet-dish-line.sub-item {
      padding-left: 14px;
      font-size: 9pt;
      font-style: italic;
    }
    .sheet-ingredients-frame {
      border: 1.5px solid #000;
      padding: 6px 8px;
      border-radius: 4px;
    }
    .sheet-ingredients-header {
      font-size: 10pt;
      font-weight: 900;
      letter-spacing: 1px;
      text-align: center;
      border-bottom: 1.5px solid #000;
      padding-bottom: 2px;
      margin-bottom: 4px;
    }
    .sheet-ingredient-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9.5pt;
      line-height: 1.25;
      padding: 2px 0;
      border-bottom: 1px dotted #ccc;
    }
    .sheet-ingredient-name {
      font-weight: 500;
    }
    .sheet-ingredient-weight {
      font-weight: 700;
    }
    .sheet-footer-remarks {
      margin-top: 8px;
      padding-top: 4px;
      border-top: 1px dashed #666;
      font-size: 9pt;
    }
  </style>
</head>
<body>
  <div class="production-sheet-card">
    ${contentHtml}
  </div>
</body>
</html>`;

    let printed = false;
    try {
      let iframe = document.getElementById('sheetPrintIframe');
      if (!iframe) {
        iframe = document.createElement('iframe');
        iframe.id = 'sheetPrintIframe';
        iframe.style.position = 'fixed';
        iframe.style.right = '0';
        iframe.style.bottom = '0';
        iframe.style.width = '0';
        iframe.style.height = '0';
        iframe.style.border = '0';
        iframe.style.visibility = 'hidden';
        document.body.appendChild(iframe);
      }

      const idoc = iframe.contentWindow.document;
      idoc.open();
      idoc.write(printHtml);
      idoc.close();

      setTimeout(() => {
        try {
          iframe.contentWindow.focus();
          iframe.contentWindow.print();
          printed = true;
        } catch (e) {
          // If iframe print fails (sandboxing), fall back to window.print()
          document.body.classList.add('sheet-modal-open');
          window.print();
          setTimeout(() => { document.body.classList.remove('sheet-modal-open'); }, 1000);
        }
      }, 300);
    } catch (e) {
      document.body.classList.add('sheet-modal-open');
      window.print();
      setTimeout(() => { document.body.classList.remove('sheet-modal-open'); }, 1000);
    }
  }

  function downloadConferencePdf(mid, btnEl) {
    if (!mid) return;
    const originalHtml = btnEl ? btnEl.innerHTML : '';
    if (btnEl) {
      btnEl.disabled = true;
      btnEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Generating PDF...';
    }

    google.script.run
      .withSuccessHandler(res => {
        if (btnEl) {
          btnEl.disabled = false;
          btnEl.innerHTML = originalHtml;
        }
        if (!res || !res.base64) {
          App.toast('Failed to generate PDF document.', 'error');
          return;
        }

        try {
          const byteCharacters = atob(res.base64);
          const byteNumbers = new Array(byteCharacters.length);
          for (let i = 0; i < byteCharacters.length; i++) {
            byteNumbers[i] = byteCharacters.charCodeAt(i);
          }
          const byteArray = new Uint8Array(byteNumbers);
          const blob = new Blob([byteArray], { type: 'application/pdf' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = res.filename || `Production_Sheet_${mid}.pdf`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 2000);
          App.toast('Production sheet PDF downloaded.');
        } catch (e) {
          const a = document.createElement('a');
          a.href = 'data:application/pdf;base64,' + res.base64;
          a.download = res.filename || `Production_Sheet_${mid}.pdf`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          App.toast('Production sheet PDF downloaded.');
        }
      })
      .withFailureHandler(err => {
        if (btnEl) {
          btnEl.disabled = false;
          btnEl.innerHTML = originalHtml;
        }
        App.toast(err && err.message ? err.message : 'Error generating PDF.', 'error');
      })
      .downloadProductionSheetPdf(mid);
  }

  function remove(id) {
    if (!App.can('menu.delete')) {
      App.toast('Permission denied: You cannot delete conference records.', 'error');
      return;
    }
    if (!window.confirm('Delete this conference record?')) return;
    google.script.run
      .withSuccessHandler(() => { App.toast('Conference deleted'); load(); App.refreshNotifications(); })
      .withFailureHandler(err => App.toast(err.message, 'error'))
      .deleteMenu(id);
  }

  return { init, onShow, load, openMenuBuilder, openProductionSheet, approveConference, downloadConferencePdf };
})();
</script>
