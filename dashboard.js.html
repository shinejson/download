<script>
var Pages = window.Pages = window.Pages || {};
/**
 * Dashboard page module.
 * Fetches stats + chart data, renders stat cards, manages Chart.js lifecycle.
 */
Pages.dashboard = (function () {
  'use strict';

  const charts = {};
  let isMounted = false;
  const els = {};

  function cacheElements() {
    els.refreshBtn = document.getElementById('dashboardRefresh');
    ['categories', 'items', 'menu', 'users', 'upcoming'].forEach(function (key) {
      els[key] = document.querySelector('[data-stat="' + key + '"]');
      els[key + 'Badge'] = document.querySelector('[data-stat-badge="' + key + '"]');
    });
    els.upcomingList = document.getElementById('upcomingList');
    ['trends', 'category', 'items'].forEach(function (chartName) {
      els[chartName + 'Loading'] = document.getElementById(chartName + 'ChartLoading');
    });
  }

  function setStat(key, value) {
    var display = els[key];
    var badge = els[key + 'Badge'];
    if (display) display.textContent = value != null ? value : 0;
    if (badge) badge.textContent = value != null ? value : 0;
  }

  function showLoading(chartName) {
    var el = els[chartName + 'Loading'];
    var canvas = document.getElementById(chartName + 'Chart');
    if (el) el.style.display = 'block';
    if (canvas) canvas.style.display = 'none';
  }

  function hideLoading(chartName) {
    var el = els[chartName + 'Loading'];
    var canvas = document.getElementById(chartName + 'Chart');
    if (el) el.style.display = 'none';
    if (canvas) canvas.style.display = 'block';
  }

  function renderEmptyList(containerEl, msg) {
    if (!containerEl) return;
    containerEl.innerHTML = '<div class="empty-state">' + App.esc(msg || 'No records found.') + '</div>';
  }

  function renderUpcomingList(upcoming) {
    var container = els.upcomingList;
    if (!container) return;
    if (!upcoming || upcoming.length === 0) {
      renderEmptyList(container, 'No upcoming conferences scheduled.');
      return;
    }
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    container.innerHTML = upcoming.map(function (u) {
      var dateStr = u.date || '';
      var monthStr = '—';
      var dayStr = '—';
      if (dateStr) {
        try {
          var parts = String(dateStr).split('-');
          if (parts.length === 3) {
            var mIdx = parseInt(parts[1], 10) - 1;
            monthStr = months[mIdx] || parts[1];
            dayStr = parseInt(parts[2], 10) || parts[2];
          }
        } catch (e) {}
      }

      return '<div class="conf-item">' +
        '<div class="conf-date-box">' +
          '<span class="conf-date-month">' + App.esc(monthStr) + '</span>' +
          '<span class="conf-date-day">' + App.esc(dayStr) + '</span>' +
        '</div>' +
        '<div class="conf-details">' +
          '<div class="conf-title" title="' + App.esc(u.conference || '') + '">' + App.esc(u.conference || 'Untitled Event') + '</div>' +
          '<div class="conf-meta">' +
            '<span class="conf-meta-item">📅 ' + App.esc(u.date || 'TBD') + '</span>' +
            '<span class="conf-meta-sep">·</span>' +
            '<span class="conf-pax-tag">👥 ' + App.esc(u.pax != null ? u.pax : 0) + ' pax</span>' +
          '</div>' +
        '</div>' +
        '<a href="#menu" class="conf-action-btn" title="View details in Menu module">&rarr;</a>' +
      '</div>';
    }).join('');
  }

  function destroyChart(name) {
    if (charts[name]) {
      try { charts[name].destroy(); } catch (e) { /* ignore */ }
      charts[name] = null;
    }
  }

  function destroyAllCharts() {
    Object.keys(charts).forEach(function (k) { destroyChart(k); });
  }

  const CHART_COLORS = {
    primary: 'rgba(37, 99, 235, 1)',
    primaryFade: 'rgba(37, 99, 235, 0.15)',
    info: 'rgba(59, 130, 246, 1)',
    success: 'rgba(16, 185, 129, 1)',
    warning: 'rgba(245, 158, 11, 1)',
    danger: 'rgba(239, 68, 68, 1)',
    muted: 'rgba(107, 114, 128, 0.5)',
    grid: 'rgba(229, 231, 235, 0.6)'
  };

  function renderTrendsChart(data) {
    destroyChart('trends');
    var ctx = document.getElementById('trendsChart');
    if (!ctx) return;
    hideLoading('trends');

    var labels = data.labels || [];
    var values = data.data || [];

    if (!labels.length || !values.length) {
      ctx.style.display = 'none';
      renderEmptyList(ctx.parentElement, 'No trend data available.');
      return;
    }

    charts['trends'] = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Conferences',
          data: values,
          borderColor: CHART_COLORS.primary,
          backgroundColor: CHART_COLORS.primaryFade,
          borderWidth: 2,
          pointRadius: 4,
          pointHoverRadius: 6,
          fill: true,
          tension: 0.35
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            mode: 'index',
            intersect: false,
            backgroundColor: 'rgba(0,0,0,0.8)',
            titleFont: { size: 13, weight: '600' },
            bodyFont: { size: 13 },
            padding: 10,
            cornerRadius: 8
          }
        },
        scales: {
          x: { grid: { display: false, color: CHART_COLORS.grid }, ticks: { color: '#6b7280', font: { size: 12 } } },
          y: { grid: { color: CHART_COLORS.grid }, ticks: { color: '#6b7280', font: { size: 12 }, stepSize: 1 }, beginAtZero: true }
        },
        animation: { duration: 750 }
      }
    });
  }

  function renderCategoryChart(data) {
    destroyChart('category');
    var ctx = document.getElementById('categoryChart');
    if (!ctx) return;
    hideLoading('category');

    var labels = data.labels || [];
    var values = data.data || [];

    if (!labels.length || values.every(function (v) { return v == null || v === 0; })) {
      ctx.style.display = 'none';
      renderEmptyList(ctx.parentElement, 'No category data available.');
      return;
    }

    var backgroundColors = [
      CHART_COLORS.primary, CHART_COLORS.info, CHART_COLORS.success,
      CHART_COLORS.warning, CHART_COLORS.danger, '#8b5cf6', '#ec4899', '#14b8a6'
    ];

    charts['category'] = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: labels,
        datasets: [{
          data: values,
          backgroundColor: values.map(function (_, i) { return backgroundColors[i % backgroundColors.length]; }),
          borderColor: '#ffffff',
          borderWidth: 2,
          hoverOffset: 16
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '70%',
        plugins: {
          legend: {
            position: 'bottom',
            labels: { padding: 20, font: { size: 12 }, color: '#6b7280' }
          },
          tooltip: {
            backgroundColor: 'rgba(0,0,0,0.8)',
            titleFont: { size: 13, weight: '600' },
            bodyFont: { size: 13 },
            padding: 10,
            cornerRadius: 8,
            callbacks: {
              label: function (ctx) {
                var total = ctx.dataset.data.reduce(function (a, b) { return a + b; }, 0);
                var pct = total ? ((ctx.parsed / total) * 100).toFixed(1) : 0;
                return ctx.label + ': ' + ctx.parsed + ' (' + pct + '%)';
              }
            }
          }
        },
        animation: { duration: 750 }
      }
    });
  }

  function renderItemsChart(data) {
    destroyChart('items');
    var ctx = document.getElementById('itemsChart');
    if (!ctx) return;
    hideLoading('items');

    var labels = data.labels || [];
    var values = data.data || [];

    if (!labels.length || values.every(function (v) { return v == null || v === 0; })) {
      ctx.style.display = 'none';
      renderEmptyList(ctx.parentElement, 'No item data available.');
      return;
    }

    charts['items'] = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: 'Items',
          data: values,
          backgroundColor: CHART_COLORS.primary,
          borderRadius: 6,
          barThickness: 'flex',
          maxBarThickness: 40
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: 'rgba(0,0,0,0.8)',
            titleFont: { size: 13, weight: '600' },
            bodyFont: { size: 13 },
            padding: 10,
            cornerRadius: 8
          }
        },
        scales: {
          x: { grid: { display: false, color: CHART_COLORS.grid }, ticks: { color: '#6b7280', font: { size: 12 } } },
          y: { grid: { color: CHART_COLORS.grid }, ticks: { color: '#6b7280', font: { size: 12 }, stepSize: 1 }, beginAtZero: true }
        },
        animation: { duration: 750 }
      }
    });
  }

  function load() {
    ['trends', 'category', 'items'].forEach(showLoading);

    google.script.run
      .withSuccessHandler(onStatsLoaded)
      .withFailureHandler(function (err) {
        App.toast(err.message || 'Failed to load dashboard stats', 'error');
        ['trends', 'category', 'items'].forEach(hideLoading);
      })
      .getDashboardStats();

    google.script.run
      .withSuccessHandler(renderTrendsChart)
      .withFailureHandler(function (err) {
        console.error('trends error', err);
        hideLoading('trends');
      })
      .getMonthlyTrends();

    google.script.run
      .withSuccessHandler(renderCategoryChart)
      .withFailureHandler(function (err) {
        console.error('category error', err);
        hideLoading('category');
      })
      .getCategoryBreakdown();

    google.script.run
      .withSuccessHandler(renderItemsChart)
      .withFailureHandler(function (err) {
        console.error('items error', err);
        hideLoading('items');
      })
      .getItemsDistribution();
  }

  function onStatsLoaded(stats) {
    if (!stats) return;
    setStat('categories', stats.categories);
    setStat('items', stats.items);
    setStat('menu', stats.menu);

    var userCard = els.users ? els.users.closest('.stat-card') : null;
    if (stats.users === null || !App.can('users.view')) {
      if (userCard) userCard.style.display = 'none';
    } else {
      if (userCard) userCard.style.display = '';
      setStat('users', stats.users);
    }

    setStat('upcoming', stats.upcoming ? stats.upcoming.length : 0);
    renderUpcomingList(stats.upcoming || []);

    var timeEl = document.getElementById('dashboardLastUpdated');
    if (timeEl) {
      var d = new Date();
      timeEl.textContent = 'Refreshed ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
  }

  function updateQuickActions() {
    var quickAdd = document.getElementById('quickAddConference');
    if (quickAdd) {
      quickAdd.style.display = App.can('menu.create') ? 'inline-flex' : 'none';
    }
  }

  function init() {
    if (isMounted) return;
    cacheElements();

    if (els.refreshBtn) {
      els.refreshBtn.addEventListener('click', function () {
        els.refreshBtn.classList.add('btn-loading');
        setTimeout(function () { els.refreshBtn.classList.remove('btn-loading'); }, 600);
        load();
      });
    }

    // Keyboard shortcut 'r' to refresh when dashboard is active
    window.addEventListener('keydown', function (e) {
      if ((e.key === 'r' || e.key === 'R') && !e.ctrlKey && !e.metaKey && !e.altKey) {
        var tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
        if (tag !== 'input' && tag !== 'textarea' && tag !== 'select') {
          if (App.currentPage === 'dashboard') {
            e.preventDefault();
            if (els.refreshBtn) {
              els.refreshBtn.classList.add('btn-loading');
              setTimeout(function () { els.refreshBtn.classList.remove('btn-loading'); }, 600);
            }
            load();
          }
        }
      }
    });

    isMounted = true;
    updateQuickActions();
    load();
  }

  function onShow() {
    var userCard = els.users ? els.users.closest('.stat-card') : null;
    if (userCard) {
      userCard.style.display = App.can('users.view') ? '' : 'none';
    }
    updateQuickActions();
    load();
    Object.keys(charts).forEach(function (name) {
      var c = charts[name];
      if (c) c.update();
    });
  }

  function destroy() {
    destroyAllCharts();
    isMounted = false;
  }

  return { init: init, onShow: onShow, load: load, destroy: destroy };
})();
</script>
