<script>
var Pages = window.Pages = window.Pages || {};
Pages.items = (function () {
  let records = [];
  let page = 1;
  let pageSize = 10;
  let searchQuery = '';
  let lengthFilter = 'all';
  let sortOrder = 'name_asc';

  function ensurePageMarkup() {
    const pageEl = document.getElementById('page-items');
    if (!pageEl) return;

    const addBtn = document.getElementById('itemsAddBtn');
    const wrap = document.getElementById('itemsTableWrap');
    const searchInput = document.getElementById('itemsSearchInput');

    if (!addBtn || !wrap || !searchInput) {
      pageEl.innerHTML = `
<div class="card">
  <div class="card-header-bar">
    <h3><i class="fa-solid fa-boxes-stacked"></i> Items Inventory</h3>
    <button class="btn btn-primary" id="itemsAddBtn" type="button">
      <i class="fa-solid fa-plus"></i> Add Item
    </button>
  </div>

  <div class="advanced-filter-bar">
    <div class="filter-group-main">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" class="search-input" id="itemsSearchInput" placeholder="Search by item name or ID...">
        <button class="search-clear-btn" id="itemsSearchClearBtn" type="button" style="display:none;" title="Clear search" aria-label="Clear search">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>

    <div class="filter-group-controls">
      <label class="filter-control">
        <i class="fa-solid fa-text-width"></i> Length:
        <select class="filter-select" id="itemsLengthFilter" aria-label="Filter by item name length">
          <option value="all">All Lengths</option>
          <option value="short">Short (&le; 8 chars)</option>
          <option value="long">Long (&gt; 12 chars)</option>
        </select>
      </label>

      <label class="filter-control">
        <i class="fa-solid fa-arrow-down-a-z"></i> Sort:
        <select class="filter-select" id="itemsSortOrder" aria-label="Sort items">
          <option value="name_asc">Name (A &rarr; Z)</option>
          <option value="name_desc">Name (Z &rarr; A)</option>
          <option value="id_desc">ID (Newest First)</option>
          <option value="id_asc">ID (Oldest First)</option>
        </select>
      </label>

      <button type="button" class="btn btn-secondary btn-sm" id="itemsResetFiltersBtn" title="Reset all filters">
        <i class="fa-solid fa-arrow-rotate-left"></i> Reset
      </button>
    </div>
  </div>

  <div id="itemsTableWrap">
    <div class="loading"><div class="spinner"></div>Loading items...</div>
  </div>
</div>`;
      bindEvents();
    }
  }

  function bindEvents() {
    const addBtn = document.getElementById('itemsAddBtn');
    if (addBtn) addBtn.onclick = () => openForm();

    const searchInput = document.getElementById('itemsSearchInput');
    const clearBtn = document.getElementById('itemsSearchClearBtn');
    const lengthSelect = document.getElementById('itemsLengthFilter');
    const sortSelect = document.getElementById('itemsSortOrder');
    const resetBtn = document.getElementById('itemsResetFiltersBtn');

    if (searchInput) {
      searchInput.oninput = (e) => {
        searchQuery = e.target.value.trim();
        if (clearBtn) clearBtn.style.display = searchQuery ? 'inline-block' : 'none';
        page = 1;
        render();
      };
    }

    if (clearBtn) {
      clearBtn.onclick = () => {
        if (searchInput) {
          searchInput.value = '';
          searchInput.focus();
        }
        searchQuery = '';
        clearBtn.style.display = 'none';
        page = 1;
        render();
      };
    }

    if (lengthSelect) {
      lengthSelect.onchange = (e) => {
        lengthFilter = e.target.value;
        page = 1;
        render();
      };
    }

    if (sortSelect) {
      sortSelect.onchange = (e) => {
        sortOrder = e.target.value;
        page = 1;
        render();
      };
    }

    if (resetBtn) {
      resetBtn.onclick = () => {
        searchQuery = '';
        lengthFilter = 'all';
        sortOrder = 'name_asc';
        page = 1;

        if (searchInput) searchInput.value = '';
        if (clearBtn) clearBtn.style.display = 'none';
        if (lengthSelect) lengthSelect.value = 'all';
        if (sortSelect) sortSelect.value = 'name_asc';

        render();
      };
    }
  }

  function init() {
    ensurePageMarkup();
    bindEvents();
  }

  function updateControls() {
    const addBtn = document.getElementById('itemsAddBtn');
    if (addBtn) {
      addBtn.style.display = App.can('items.create') ? '' : 'none';
    }
  }

  function onShow() {
    ensurePageMarkup();
    bindEvents();
    updateControls();
    load();
  }

  function getTableWrap() {
    ensurePageMarkup();
    let wrap = document.getElementById('itemsTableWrap');
    if (!wrap) {
      const pageEl = document.getElementById('page-items');
      if (pageEl) {
        wrap = pageEl.querySelector('#itemsTableWrap');
      }
    }
    return wrap;
  }

  function load() {
    updateControls();
    const wrap = getTableWrap();
    if (!wrap) return;
    wrap.innerHTML = '<div class="loading"><div class="spinner"></div>Loading items...</div>';
    google.script.run
      .withSuccessHandler(data => { records = data || []; render(); })
      .withFailureHandler(err => {
        if (wrap) wrap.innerHTML = `<div class="empty-state" style="color:var(--danger)">${App.esc(err.message)}</div>`;
      })
      .getItems();
  }

  function getFilteredAndSorted() {
    const q = searchQuery.toLowerCase();

    let list = records.filter(r => {
      const name = String(r['Items Name'] || '');
      const id = String(r['ID'] || '');

      // Length filter
      if (lengthFilter === 'short' && (name.length === 0 || name.length > 8)) return false;
      if (lengthFilter === 'long' && name.length <= 12) return false;

      // Text search
      if (q) {
        const matchName = name.toLowerCase().includes(q);
        const matchId = id.toLowerCase().includes(q);
        if (!matchName && !matchId) return false;
      }

      return true;
    });

    // Sort list
    list.sort((a, b) => {
      const nameA = String(a['Items Name'] || '').toLowerCase();
      const nameB = String(b['Items Name'] || '').toLowerCase();
      const idA = String(a['ID'] || '');
      const idB = String(b['ID'] || '');

      switch (sortOrder) {
        case 'name_desc':
          return nameB.localeCompare(nameA);
        case 'id_desc':
          return idB.localeCompare(idA, undefined, { numeric: true });
        case 'id_asc':
          return idA.localeCompare(idB, undefined, { numeric: true });
        case 'name_asc':
        default:
          return nameA.localeCompare(nameB);
      }
    });

    return list;
  }

  function render() {
    updateControls();
    const wrap = getTableWrap();
    if (!wrap) return;

    const filtered = getFilteredAndSorted();
    const canEdit = App.can('items.edit');
    const canDelete = App.can('items.delete');
    const hasActions = canEdit || canDelete;

    const headers = hasActions
      ? ['ID', 'Item Name', 'Actions']
      : ['ID', 'Item Name'];

    App.renderPaginatedTable({
      container: wrap,
      headers: headers,
      rows: filtered,
      page: page,
      pageSize: pageSize,
      emptyMsg: searchQuery || lengthFilter !== 'all'
        ? 'No items match your filter criteria.'
        : 'No items found.',
      onPageChange: (newPage) => {
        page = newPage;
        render();
      },
      onPageSizeChange: (newSize) => {
        pageSize = newSize;
        page = 1;
        render();
      },
      rowRenderer: (r) => `
        <tr>
          <td><code>${App.esc(r['ID'])}</code></td>
          <td><strong>${App.esc(r['Items Name'])}</strong></td>
          ${hasActions ? `
            <td class="actions-cell">
              ${canEdit ? `<button class="btn btn-secondary btn-sm" data-edit="${App.esc(r['ID'])}" title="Edit item"><i class="fa-solid fa-pen-to-square"></i> Edit</button>` : ''}
              ${canDelete ? `<button class="btn btn-danger btn-sm" data-del="${App.esc(r['ID'])}" title="Delete item"><i class="fa-solid fa-trash-can"></i> Delete</button>` : ''}
            </td>
          ` : ''}
        </tr>
      `
    });

    if (canEdit) {
      wrap.querySelectorAll('[data-edit]').forEach(b => {
        b.onclick = () => openForm(records.find(x => String(x['ID']) === b.dataset.edit));
      });
    }

    if (canDelete) {
      wrap.querySelectorAll('[data-del]').forEach(b => {
        b.onclick = () => remove(b.dataset.del);
      });
    }
  }

  function openForm(record) {
    const isEdit = !!record;
    if (isEdit && !App.can('items.edit')) {
      App.toast('Permission denied: You cannot edit items.', 'error');
      return;
    }
    if (!isEdit && !App.can('items.create')) {
      App.toast('Permission denied: You cannot create items.', 'error');
      return;
    }

    App.openModal({
      title: isEdit ? 'Edit Item' : 'New Item',
      fields: [
        { name: 'Items Name', label: 'Items Name', value: record ? record['Items Name'] : '' }
      ],
      onSave: (data) => new Promise((resolve, reject) => {
        if (!data['Items Name']) return reject(new Error('Name is required'));
        if (isEdit) {
          google.script.run
            .withSuccessHandler(() => { App.toast('Item updated'); load(); refreshNotifications(); })
            .withFailureHandler(reject)
            .updateItem(record['ID'], data);
        } else {
          google.script.run
            .withSuccessHandler(() => { App.toast('Item created'); load(); refreshNotifications(); })
            .withFailureHandler(reject)
            .createItem(data);
        }
      })
    });
  }

  function remove(id) {
    if (!App.can('items.delete')) {
      App.toast('Permission denied: You cannot delete items.', 'error');
      return;
    }
    if (!window.confirm('Delete this item?')) return;
    google.script.run
      .withSuccessHandler(() => { App.toast('Item deleted'); load(); refreshNotifications(); })
      .withFailureHandler(err => App.toast(err.message, 'error'))
      .deleteItem(id);
  }

  return { init, onShow, load };
})();
</script>
