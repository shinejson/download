<script>
Pages.items = (function () {
  let records = [];
  let page = 1;
  let pageSize = 10;
  let searchQuery = '';
  let lengthFilter = 'all';
  let sortOrder = 'name_asc';

  function init() {
    const addBtn = document.getElementById('itemsAddBtn');
    if (addBtn) addBtn.addEventListener('click', () => openForm());

    const searchInput = document.getElementById('itemsSearchInput');
    const clearBtn = document.getElementById('itemsSearchClearBtn');
    const lengthSelect = document.getElementById('itemsLengthFilter');
    const sortSelect = document.getElementById('itemsSortOrder');
    const resetBtn = document.getElementById('itemsResetFiltersBtn');

    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.trim();
        if (clearBtn) clearBtn.style.display = searchQuery ? 'inline-block' : 'none';
        page = 1;
        render();
      });
    }

    if (clearBtn) {
      clearBtn.addEventListener('click', () => {
        if (searchInput) {
          searchInput.value = '';
          searchInput.focus();
        }
        searchQuery = '';
        clearBtn.style.display = 'none';
        page = 1;
        render();
      });
    }

    if (lengthSelect) {
      lengthSelect.addEventListener('change', (e) => {
        lengthFilter = e.target.value;
        page = 1;
        render();
      });
    }

    if (sortSelect) {
      sortSelect.addEventListener('change', (e) => {
        sortOrder = e.target.value;
        page = 1;
        render();
      });
    }

    if (resetBtn) {
      resetBtn.addEventListener('click', () => {
        searchQuery = '';
        lengthFilter = 'all';
        sortOrder = 'name_asc';
        page = 1;

        if (searchInput) searchInput.value = '';
        if (clearBtn) clearBtn.style.display = 'none';
        if (lengthSelect) lengthSelect.value = 'all';
        if (sortSelect) sortSelect.value = 'name_asc';

        render();
      });
    }
  }

  function updateControls() {
    const addBtn = document.getElementById('itemsAddBtn');
    if (addBtn) {
      addBtn.style.display = App.can('items.create') ? '' : 'none';
    }
  }

  function onShow() {
    updateControls();
    load();
  }

  function load() {
    updateControls();
    const wrap = document.getElementById('itemsTableWrap');
    wrap.innerHTML = '<div class="loading"><div class="spinner"></div>Loading items...</div>';
    google.script.run
      .withSuccessHandler(data => { records = data || []; render(); })
      .withFailureHandler(err => {
        wrap.innerHTML = `<div class="empty-state" style="color:var(--danger)">${App.esc(err.message)}</div>`;
      })
      .getItems();
  }

  function getFilteredAndSorted() {
    const q = searchQuery.toLowerCase();

    let list = records.filter(r => {
      const name = String(r['Items Name'] || '');
      const id = String(r['ID'] || '');

      // Length filter
      if (lengthFilter === 'short' && (name.length === 0 || name.length > 8)) return false;
      if (lengthFilter === 'long' && name.length <= 12) return false;

      // Text search
      if (q) {
        const matchName = name.toLowerCase().includes(q);
        const matchId = id.toLowerCase().includes(q);
        if (!matchName && !matchId) return false;
      }

      return true;
    });

    // Sort list
    list.sort((a, b) => {
      const nameA = String(a['Items Name'] || '').toLowerCase();
      const nameB = String(b['Items Name'] || '').toLowerCase();
      const idA = String(a['ID'] || '');
      const idB = String(b['ID'] || '');

      switch (sortOrder) {
        case 'name_desc':
          return nameB.localeCompare(nameA);
        case 'id_desc':
          return idB.localeCompare(idA, undefined, { numeric: true });
        case 'id_asc':
          return idA.localeCompare(idB, undefined, { numeric: true });
        case 'name_asc':
        default:
          return nameA.localeCompare(nameB);
      }
    });

    return list;
  }

  function render() {
    updateControls();
    const wrap = document.getElementById('itemsTableWrap');
    if (!wrap) return;

    const filtered = getFilteredAndSorted();
    const canEdit = App.can('items.edit');
    const canDelete = App.can('items.delete');
    const hasActions = canEdit || canDelete;

    const headers = hasActions
      ? ['ID', 'Item Name', 'Actions']
      : ['ID', 'Item Name'];

    App.renderPaginatedTable({
      container: wrap,
      headers: headers,
      rows: filtered,
      page: page,
      pageSize: pageSize,
      emptyMsg: searchQuery || lengthFilter !== 'all'
        ? 'No items match your filter criteria.'
        : 'No items found.',
      onPageChange: (newPage) => {
        page = newPage;
        render();
      },
      onPageSizeChange: (newSize) => {
        pageSize = newSize;
        page = 1;
        render();
      },
      rowRenderer: (r) => `
        <tr>
          <td><code>${App.esc(r['ID'])}</code></td>
          <td><strong>${App.esc(r['Items Name'])}</strong></td>
          ${hasActions ? `
            <td class="actions-cell">
              ${canEdit ? `<button class="btn btn-secondary btn-sm" data-edit="${App.esc(r['ID'])}" title="Edit item"><i class="fa-solid fa-pen-to-square"></i> Edit</button>` : ''}
              ${canDelete ? `<button class="btn btn-danger btn-sm" data-del="${App.esc(r['ID'])}" title="Delete item"><i class="fa-solid fa-trash-can"></i> Delete</button>` : ''}
            </td>
          ` : ''}
        </tr>
      `
    });

    if (canEdit) {
      wrap.querySelectorAll('[data-edit]').forEach(b => {
        b.onclick = () => openForm(records.find(x => String(x['ID']) === b.dataset.edit));
      });
    }

    if (canDelete) {
      wrap.querySelectorAll('[data-del]').forEach(b => {
        b.onclick = () => remove(b.dataset.del);
      });
    }
  }

  function openForm(record) {
    const isEdit = !!record;
    if (isEdit && !App.can('items.edit')) {
      App.toast('Permission denied: You cannot edit items.', 'error');
      return;
    }
    if (!isEdit && !App.can('items.create')) {
      App.toast('Permission denied: You cannot create items.', 'error');
      return;
    }

    App.openModal({
      title: isEdit ? 'Edit Item' : 'New Item',
      fields: [
        { name: 'Items Name', label: 'Items Name', value: record ? record['Items Name'] : '' }
      ],
      onSave: (data) => new Promise((resolve, reject) => {
        if (!data['Items Name']) return reject(new Error('Name is required'));
        if (isEdit) {
          google.script.run
            .withSuccessHandler(() => { App.toast('Item updated'); load(); refreshNotifications(); })
            .withFailureHandler(reject)
            .updateItem(record['ID'], data);
        } else {
          google.script.run
            .withSuccessHandler(() => { App.toast('Item created'); load(); refreshNotifications(); })
            .withFailureHandler(reject)
            .createItem(data);
        }
      })
    });
  }

  function remove(id) {
    if (!App.can('items.delete')) {
      App.toast('Permission denied: You cannot delete items.', 'error');
      return;
    }
    if (!window.confirm('Delete this item?')) return;
    google.script.run
      .withSuccessHandler(() => { App.toast('Item deleted'); load(); refreshNotifications(); })
      .withFailureHandler(err => App.toast(err.message, 'error'))
      .deleteItem(id);
  }

  return { init, onShow, load };
})();
</script>
