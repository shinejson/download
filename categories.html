<div class="stat-grid" id="dashboardStats">
  <div class="stat-card">
    <div class="stat-icon">🗂️</div>
    <div>
      <div class="stat-value" data-stat="categories">—</div>
      <div class="stat-label">Categories</div>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-icon">📦</div>
    <div>
      <div class="stat-value" data-stat="items">—</div>
      <div class="stat-label">Items</div>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-icon">📅</div>
    <div>
      <div class="stat-value" data-stat="menu">—</div>
      <div class="stat-label">Conferences</div>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-icon">👥</div>
    <div>
      <div class="stat-value" data-stat="users">—</div>
      <div class="stat-label">Users</div>
    </div>
  </div>
</div>

<div class="dashboard-row">
  <div class="card">
    <h3>📅 Upcoming Conferences</h3>
    <div id="upcomingList" class="list">
      <div class="loading"><div class="spinner"></div>Loading...</div>
    </div>
  </div>
  <div class="card">
    <h3>⚡ Quick Actions</h3>
    <div class="list">
      <button class="btn btn-secondary" data-quick="categories">+ Add Category</button>
      <button class="btn btn-secondary" data-quick="items">+ Add Item</button>
      <button class="btn btn-secondary" data-quick="menu">+ Add Conference</button>
      <button class="btn btn-secondary" data-quick="users">+ Add User</button>
    </div>
  </div>
</div>
