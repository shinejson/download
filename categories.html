<div class="table-toolbar">
  <div class="toolbar-group">
    <input type="text" class="search" id="categoriesSearch" placeholder="Search categories...">
    <select class="filter-select" id="categoriesFilterType" aria-label="Category filter type">
      <option value="all">All names</option>
      <option value="contains">Contains</option>
      <option value="starts">Starts with</option>
      <option value="short">Short names</option>
      <option value="long">Long names</option>
    </select>
  </div>
  <button class="btn btn-primary" id="categoriesAddBtn">+ Add Category</button>
</div>
<div id="categoriesTableWrap">
  <div class="loading"><div class="spinner"></div>Loading...</div>
</div>
