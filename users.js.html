<script>
var Pages = window.Pages = window.Pages || {};
Pages.users = (function () {
  let records = [];
  let page = 1;
  let pageSize = 10;
  let searchQuery = '';
  let roleFilter = 'all';
  let statusFilter = 'all';
  let sortOrder = 'name_asc';
  let selectedIds = new Set();

  function ensurePageMarkup() {
    const pageEl = document.getElementById('page-users');
    if (!pageEl) return;

    const addBtn = document.getElementById('usersAddBtn');
    const wrap = document.getElementById('usersTableWrap');
    const searchInput = document.getElementById('usersSearchInput');

    if (!addBtn || !wrap || !searchInput) {
      pageEl.innerHTML = `
<div class="card">
  <div class="card-header-bar">
    <h3><i class="fa-solid fa-users"></i> Users Management</h3>
    <button class="btn btn-primary" id="usersAddBtn" type="button">
      <i class="fa-solid fa-plus"></i> Add User
    </button>
  </div>

  <div class="advanced-filter-bar">
    <div class="filter-group-main">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" class="search-input" id="usersSearchInput" placeholder="Search by name, username, email, department, or user ID...">
        <button class="search-clear-btn" id="usersSearchClearBtn" type="button" style="display:none;" title="Clear search" aria-label="Clear search">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>

    <div class="filter-group-controls">
      <label class="filter-control">
        <i class="fa-solid fa-user-shield"></i> Role:
        <select class="filter-select" id="usersRoleFilter" aria-label="Filter by role">
          <option value="all">All Roles</option>
          <option value="admin">Admin</option>
          <option value="manager">Manager</option>
          <option value="staff">Staff</option>
          <option value="viewer">Viewer</option>
        </select>
      </label>

      <label class="filter-control">
        <i class="fa-solid fa-circle-check"></i> Status:
        <select class="filter-select" id="usersStatusFilter" aria-label="Filter by status">
          <option value="all">All Statuses</option>
          <option value="active">Active only</option>
          <option value="inactive">Inactive only</option>
        </select>
      </label>

      <label class="filter-control">
        <i class="fa-solid fa-arrow-down-a-z"></i> Sort:
        <select class="filter-select" id="usersSortOrder" aria-label="Sort users">
          <option value="name_asc">Name (A &rarr; Z)</option>
          <option value="name_desc">Name (Z &rarr; A)</option>
          <option value="username_asc">Username (A &rarr; Z)</option>
          <option value="role_asc">Role (A &rarr; Z)</option>
          <option value="id_desc">Newest First</option>
          <option value="id_asc">Oldest First</option>
        </select>
      </label>

      <button type="button" class="btn btn-secondary btn-sm" id="usersResetFiltersBtn" title="Reset all filters">
        <i class="fa-solid fa-arrow-rotate-left"></i> Reset
      </button>
    </div>
  </div>

  <div id="usersBulkBar" class="bulk-action-bar" style="display:none;"></div>

  <div id="usersTableWrap">
    <div class="loading"><div class="spinner"></div>Loading users...</div>
  </div>
</div>`;
      bindEvents();
    }
  }

  function bindEvents() {
    const addBtn = document.getElementById('usersAddBtn');
    if (addBtn) addBtn.onclick = () => openForm();

    const searchInput = document.getElementById('usersSearchInput');
    const clearBtn = document.getElementById('usersSearchClearBtn');
    const roleSelect = document.getElementById('usersRoleFilter');
    const statusSelect = document.getElementById('usersStatusFilter');
    const sortSelect = document.getElementById('usersSortOrder');
    const resetBtn = document.getElementById('usersResetFiltersBtn');

    if (searchInput) {
      searchInput.oninput = (e) => {
        searchQuery = e.target.value.trim();
        if (clearBtn) clearBtn.style.display = searchQuery ? 'inline-block' : 'none';
        page = 1;
        render();
      };
    }

    if (clearBtn) {
      clearBtn.onclick = () => {
        if (searchInput) {
          searchInput.value = '';
          searchInput.focus();
        }
        searchQuery = '';
        clearBtn.style.display = 'none';
        page = 1;
        render();
      };
    }

    if (roleSelect) {
      roleSelect.onchange = (e) => {
        roleFilter = e.target.value;
        page = 1;
        render();
      };
    }

    if (statusSelect) {
      statusSelect.onchange = (e) => {
        statusFilter = e.target.value;
        page = 1;
        render();
      };
    }

    if (sortSelect) {
      sortSelect.onchange = (e) => {
        sortOrder = e.target.value;
        page = 1;
        render();
      };
    }

    if (resetBtn) {
      resetBtn.onclick = () => {
        searchQuery = '';
        roleFilter = 'all';
        statusFilter = 'all';
        sortOrder = 'name_asc';
        page = 1;

        if (searchInput) searchInput.value = '';
        if (clearBtn) clearBtn.style.display = 'none';
        if (roleSelect) roleSelect.value = 'all';
        if (statusSelect) statusSelect.value = 'all';
        if (sortSelect) sortSelect.value = 'name_asc';

        render();
      };
    }
  }

  function init() {
    ensurePageMarkup();
    bindEvents();
  }

  function updateControls() {
    const addBtn = document.getElementById('usersAddBtn');
    if (addBtn) {
      addBtn.style.display = App.can('users.create') ? '' : 'none';
    }
    updateBulkBar();
  }

  function updateBulkBar() {
    const bar = document.getElementById('usersBulkBar');
    if (!bar) return;
    const canDel = App.can('users.delete');
    if (selectedIds.size === 0 || !canDel) {
      bar.style.display = 'none';
      bar.innerHTML = '';
      return;
    }
    bar.style.display = 'flex';
    const count = selectedIds.size;
    bar.innerHTML = `
      <div class="bulk-action-info">
        <i class="fa-solid fa-circle-check"></i>
        <span><strong>${count}</strong> user${count === 1 ? '' : 's'} selected</span>
      </div>
      <div class="bulk-action-btns">
        <button type="button" class="btn btn-danger btn-sm" id="usersBulkDeleteBtn">
          <i class="fa-solid fa-trash-can"></i> Delete Selected (${count})
        </button>
        <button type="button" class="btn btn-secondary btn-sm" id="usersBulkClearBtn">
          <i class="fa-solid fa-xmark"></i> Deselect All
        </button>
      </div>
    `;
    const delBtn = document.getElementById('usersBulkDeleteBtn');
    if (delBtn) delBtn.onclick = () => removeBulk();
    const clearBtn = document.getElementById('usersBulkClearBtn');
    if (clearBtn) {
      clearBtn.onclick = () => {
        selectedIds.clear();
        render();
      };
    }
  }

  function removeBulk() {
    if (!App.can('users.delete')) {
      App.toast('Permission denied: You cannot delete users.', 'error');
      return;
    }
    const currentUsername = App.currentUser ? String(App.currentUser.username).toLowerCase() : '';
    // Filter out current user from selection if any
    const toDelete = Array.from(selectedIds).filter(id => {
      const u = records.find(x => String(x.userid) === id);
      return !u || String(u.username || '').toLowerCase() !== currentUsername;
    });

    if (toDelete.length === 0) {
      App.toast('No eligible users selected for deletion.', 'error');
      return;
    }

    if (!window.confirm(`Are you sure you want to delete ${toDelete.length} selected user${toDelete.length === 1 ? '' : 's'}? This action cannot be undone.`)) {
      return;
    }

    App.toast(`Deleting ${toDelete.length} user${toDelete.length === 1 ? '' : 's'}...`, 'info');
    google.script.run
      .withSuccessHandler((res) => {
        selectedIds.clear();
        const deletedCount = (res && typeof res.count === 'number') ? res.count : toDelete.length;
        App.toast(`Successfully deleted ${deletedCount} user${deletedCount === 1 ? '' : 's'}.`);
        load();
        if (typeof refreshNotifications === 'function') refreshNotifications();
      })
      .withFailureHandler(err => App.toast(err.message, 'error'))
      .deleteUsersBulk(toDelete);
  }

  function onShow() {
    ensurePageMarkup();
    bindEvents();
    updateControls();
    load();
  }

  function getTableWrap() {
    ensurePageMarkup();
    let wrap = document.getElementById('usersTableWrap');
    if (!wrap) {
      const pageEl = document.getElementById('page-users');
      if (pageEl) {
        wrap = pageEl.querySelector('#usersTableWrap');
      }
    }
    return wrap;
  }

  function load() {
    updateControls();
    const wrap = getTableWrap();
    if (!wrap) return;
    wrap.innerHTML = '<div class="loading"><div class="spinner"></div>Loading users...</div>';
    google.script.run
      .withSuccessHandler(data => {
        records = data || [];
        const validIds = new Set(records.map(r => String(r.userid)));
        selectedIds.forEach(id => {
          if (!validIds.has(id)) selectedIds.delete(id);
        });
        render();
      })
      .withFailureHandler(err => {
        if (wrap) wrap.innerHTML = `<div class="empty-state" style="color:var(--danger)">${App.esc(err.message)}</div>`;
      })
      .getUsers();
  }

  function getFilteredAndSorted() {
    const q = searchQuery.toLowerCase();

    let list = records.filter(r => {
      // Role filter
      if (roleFilter !== 'all' && String(r.role || '').toLowerCase() !== roleFilter) {
        return false;
      }
      // Status filter
      if (statusFilter !== 'all' && String(r.status || '').toLowerCase() !== statusFilter) {
        return false;
      }
      // Text search
      if (q) {
        const haystack = [
          r.firstname,
          r.lastname,
          r.email,
          r.username,
          r.role,
          r.department,
          r.status,
          r.userid
        ].join(' ').toLowerCase();
        if (!haystack.includes(q)) return false;
      }
      return true;
    });

    // Sort list
    list.sort((a, b) => {
      const nameA = ((a.firstname || '') + ' ' + (a.lastname || '')).trim().toLowerCase();
      const nameB = ((b.firstname || '') + ' ' + (b.lastname || '')).trim().toLowerCase();
      const userA = String(a.username || '').toLowerCase();
      const userB = String(b.username || '').toLowerCase();
      const roleA = String(a.role || '').toLowerCase();
      const roleB = String(b.role || '').toLowerCase();
      const idA = String(a.userid || '');
      const idB = String(b.userid || '');

      switch (sortOrder) {
        case 'name_desc':
          return nameB.localeCompare(nameA);
        case 'username_asc':
          return userA.localeCompare(userB);
        case 'role_asc':
          return roleA.localeCompare(roleB);
        case 'id_desc':
          return idB.localeCompare(idA, undefined, { numeric: true });
        case 'id_asc':
          return idA.localeCompare(idB, undefined, { numeric: true });
        case 'name_asc':
        default:
          return nameA.localeCompare(nameB);
      }
    });

    return list;
  }

  function render() {
    updateControls();
    const wrap = getTableWrap();
    if (!wrap) return;

    const filtered = getFilteredAndSorted();
    const canEdit = App.can('users.edit');
    const canDelete = App.can('users.delete');
    const hasActions = canEdit || canDelete;
    const currentUsername = App.currentUser ? String(App.currentUser.username).toLowerCase() : '';

    const startIdx = (page - 1) * pageSize;
    const pageRows = filtered.slice(startIdx, startIdx + pageSize);
    const eligiblePageRows = pageRows.filter(r => String(r.username || '').toLowerCase() !== currentUsername);
    const allPageSelected = eligiblePageRows.length > 0 && eligiblePageRows.every(r => selectedIds.has(String(r.userid)));

    const headers = [];
    if (canDelete) {
      headers.push({
        html: `<input type="checkbox" class="table-checkbox" id="usersSelectAll" title="Select all eligible on this page" ${allPageSelected ? 'checked' : ''}>`,
        className: 'th-checkbox'
      });
    }
    headers.push('User ID', 'Name', 'Contact', 'Email', 'Username', 'Role', 'Department', 'Status');
    if (hasActions) headers.push('Actions');

    App.renderPaginatedTable({
      container: wrap,
      headers: headers,
      rows: filtered,
      page: page,
      pageSize: pageSize,
      emptyMsg: searchQuery || roleFilter !== 'all' || statusFilter !== 'all'
        ? 'No users match your filter criteria.'
        : 'No users registered yet.',
      onPageChange: (newPage) => {
        page = newPage;
        render();
      },
      onPageSizeChange: (newSize) => {
        pageSize = newSize;
        page = 1;
        render();
      },
      rowRenderer: (r) => {
        const idStr = String(r.userid);
        const isSelf = String(r.username || '').toLowerCase() === currentUsername;
        const isSelected = selectedIds.has(idStr);

        return `
          <tr class="${isSelected ? 'row-selected' : ''}">
            ${canDelete ? `
              <td class="th-checkbox" style="text-align:center;">
                ${isSelf ? `
                  <input type="checkbox" class="table-checkbox" disabled title="You cannot select your own account" style="opacity:0.35; cursor:not-allowed;">
                ` : `
                  <input type="checkbox" class="table-checkbox row-select-checkbox" data-select-id="${App.esc(idStr)}" ${isSelected ? 'checked' : ''}>
                `}
              </td>
            ` : ''}
            <td><code>${App.esc(idStr)}</code></td>
            <td><strong>${App.esc(r.firstname)} ${App.esc(r.lastname)}</strong></td>
            <td>${App.esc(r.contact || '—')}</td>
            <td>${App.esc(r.email || '—')}</td>
            <td><code>@${App.esc(r.username)}</code></td>
            <td>${roleBadge(r.role)}</td>
            <td>${App.esc(r.department || '—')}</td>
            <td>${statusBadge(r.status)}</td>
            ${hasActions ? `
              <td class="actions-cell">
                ${canEdit ? `<button class="btn btn-secondary btn-sm" data-edit="${App.esc(idStr)}" title="Edit user"><i class="fa-solid fa-pen-to-square"></i> Edit</button>` : ''}
                ${(canDelete && !isSelf) ? `<button class="btn btn-danger btn-sm" data-del="${App.esc(idStr)}" title="Delete user"><i class="fa-solid fa-trash-can"></i> Delete</button>` : ''}
                ${(canDelete && isSelf) ? `<button class="btn btn-secondary btn-sm" disabled title="You cannot delete your own account" style="opacity:0.5;cursor:not-allowed;">Self</button>` : ''}
              </td>
            ` : ''}
          </tr>
        `;
      }
    });

    const selectAllEl = wrap.querySelector('#usersSelectAll');
    if (selectAllEl) {
      selectAllEl.onchange = (e) => {
        const checked = e.target.checked;
        eligiblePageRows.forEach(r => {
          const id = String(r.userid);
          if (checked) selectedIds.add(id);
          else selectedIds.delete(id);
        });
        render();
      };
    }

    wrap.querySelectorAll('.row-select-checkbox').forEach(cb => {
      cb.onchange = (e) => {
        const id = e.target.dataset.selectId;
        if (e.target.checked) selectedIds.add(id);
        else selectedIds.delete(id);
        render();
      };
    });

    if (canEdit) {
      wrap.querySelectorAll('[data-edit]').forEach(b => {
        b.onclick = () => openForm(records.find(x => String(x.userid) === b.dataset.edit));
      });
    }

    if (canDelete) {
      wrap.querySelectorAll('[data-del]').forEach(b => {
        b.onclick = () => remove(b.dataset.del);
      });
    }

    updateBulkBar();
  }

  function roleBadge(r) {
    const role = String(r || 'viewer').toLowerCase();
    const labels = {
      admin: 'Admin',
      manager: 'Manager',
      staff: 'Staff',
      viewer: 'Viewer'
    };
    return `<span class="role-badge role-${App.esc(role)}">${App.esc(labels[role] || role)}</span>`;
  }

  function statusBadge(s) {
    const active = String(s || '').toLowerCase() === 'active';
    const color = active ? '#10b981' : '#ef4444';
    return `<span style="display:inline-block; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:600; background:${color}20; color:${color};">${App.esc(s || '—')}</span>`;
  }

  function openForm(record) {
    const isEdit = !!record;
    if (isEdit && !App.can('users.edit')) {
      App.toast('Permission denied: You cannot edit users.', 'error');
      return;
    }
    if (!isEdit && !App.can('users.create')) {
      App.toast('Permission denied: You cannot create users.', 'error');
      return;
    }

    App.openModal({
      title: isEdit ? 'Edit User' : 'New User',
      fields: [
        { name: 'firstname', label: 'First name', value: record ? record.firstname : '' },
        { name: 'lastname', label: 'Last name', value: record ? record.lastname : '' },
        { name: 'contact', label: 'Contact', value: record ? record.contact : '' },
        { name: 'email', label: 'Email', type: 'email', value: record ? record.email : '' },
        { name: 'username', label: 'Username', value: record ? record.username : '' },
        { name: 'password', label: isEdit ? 'Password (leave blank to keep current)' : 'Password', type: 'password', value: '' },
        {
          name: 'role',
          label: 'Role',
          type: 'select',
          value: record ? String(record.role || 'staff').toLowerCase() : 'staff',
          options: [
            { value: 'admin', label: 'Admin (Full Access)' },
            { value: 'manager', label: 'Manager (Manage Records)' },
            { value: 'staff', label: 'Staff (Coordinator)' },
            { value: 'viewer', label: 'Viewer (Read-Only)' }
          ]
        },
        { name: 'department', label: 'Department', value: record ? record.department : '' },
        {
          name: 'status',
          label: 'Status',
          type: 'select',
          value: record ? record.status : 'active',
          options: [{ value: 'active', label: 'Active' }, { value: 'inactive', label: 'Inactive' }]
        }
      ],
      onSave: (data) => new Promise((resolve, reject) => {
        const usernameVal = (data.username || '').trim();
        if (!usernameVal) return reject(new Error('Username is required.'));

        // Client-side duplicate check
        const isDup = records.some(r => {
          if (isEdit && String(r.userid) === String(record.userid)) return false;
          return String(r.username || '').trim().toLowerCase() === usernameVal.toLowerCase();
        });
        if (isDup) {
          return reject(new Error(`A user with username "${usernameVal}" already exists.`));
        }

        if (isEdit) {
          if (!data.password) delete data.password;
          google.script.run
            .withSuccessHandler((res) => {
              App.toast('User updated');
              load();
              if (typeof refreshNotifications === 'function') refreshNotifications();
              resolve(res);
            })
            .withFailureHandler(reject)
            .updateUser(record.userid, data);
        } else {
          google.script.run
            .withSuccessHandler((res) => {
              App.toast('User created');
              load();
              if (typeof refreshNotifications === 'function') refreshNotifications();
              resolve(res);
            })
            .withFailureHandler(reject)
            .createUser(data);
        }
      })
    });
  }

  function remove(id) {
    if (!App.can('users.delete')) {
      App.toast('Permission denied: You cannot delete users.', 'error');
      return;
    }
    if (!window.confirm('Delete this user?')) return;
    google.script.run
      .withSuccessHandler(() => {
        selectedIds.delete(String(id));
        App.toast('User deleted');
        load();
        if (typeof refreshNotifications === 'function') refreshNotifications();
      })
      .withFailureHandler(err => App.toast(err.message, 'error'))
      .deleteUser(id);
  }

  return { init, onShow, load };
})();
</script>
