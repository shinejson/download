<style>
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --sidebar-bg: #111827;
    --sidebar-hover: #1f2937;
    --sidebar-active: #2563eb;
    --bg: #f3f4f6;
    --card-bg: #ffffff;
    --text: #111827;
    --text-light: #6b7280;
    --border: #e5e7eb;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --sidebar-w: 240px;
    --topnav-h: 60px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }

  /* ===== Sidebar ===== */
  #sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: var(--sidebar-w);
    background: var(--sidebar-bg);
    color: #e5e7eb;
    display: flex;
    flex-direction: column;
    transition: transform .25s ease;
    z-index: 100;
  }
  #sidebar.hidden { transform: translateX(-100%); }

  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 18px 20px;
    font-weight: 700;
    font-size: 16px;
    color: #fff;
    border-bottom: 1px solid #1f2937;
  }
  .sidebar-brand .logo {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    display: grid; place-items: center;
    font-size: 16px;
  }

  .sidebar-nav { flex: 1; padding: 12px 8px; overflow-y: auto; }
  .sidebar-nav a {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    color: #d1d5db;
    text-decoration: none;
    border-radius: 8px;
    margin-bottom: 2px;
    transition: background .15s;
    font-weight: 500;
  }
  .sidebar-nav a:hover { background: var(--sidebar-hover); color: #fff; }
  .sidebar-nav a.active { background: var(--sidebar-active); color: #fff; }
  .sidebar-nav a .icon { font-size: 18px; width: 22px; text-align: center; }
  .sidebar-nav a.danger { color: #fecaca; }
  .sidebar-nav a.danger:hover { background: rgba(239,68,68,.12); color: #fff; }

  .nav-link-action { margin-top: 8px; }

  .sidebar-footer {
    padding: 14px 20px;
    border-top: 1px solid #1f2937;
    font-size: 12px;
    color: #9ca3af;
  }

  .user-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-radius: 999px;
    background: #f3f4f6;
    border: 1px solid var(--border);
  }
  .user-chip .avatar {
    width: 26px; height: 26px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
  }

  /* ===== Main ===== */
  #main {
    margin-left: var(--sidebar-w);
    min-height: 100vh;
    transition: margin-left .25s ease;
    display: flex;
    flex-direction: column;
  }
  #main.full { margin-left: 0; }

  /* ===== Top Nav ===== */
  #topnav {
    height: var(--topnav-h);
    background: #fff;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  #topnav .toggle-btn {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: var(--text-light);
    padding: 6px;
    border-radius: 6px;
  }
  #topnav .toggle-btn:hover { background: var(--bg); color: var(--text); }
  #topnav .page-title { font-size: 18px; font-weight: 600; flex: 1; }
  #topnav .user-chip {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; background: var(--bg); border-radius: 999px;
    font-size: 13px; color: var(--text-light);
  }
  #topnav .user-chip .avatar {
    width: 26px; height: 26px; border-radius: 50%;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    color: #fff; display: grid; place-items: center;
    font-size: 12px; font-weight: 600;
  }

  /* ===== Content ===== */
  #content { padding: 24px; flex: 1; }

  /* ===== Cards ===== */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .card h3 { font-size: 15px; margin-bottom: 12px; color: var(--text); }

  /* ===== Dashboard ===== */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .stat-card .stat-icon {
    width: 44px; height: 44px; border-radius: 10px;
    display: grid; place-items: center; font-size: 22px;
    background: #eff6ff; color: var(--primary);
  }
  .stat-card .stat-value { font-size: 22px; font-weight: 700; }
  .stat-card .stat-label { font-size: 12px; color: var(--text-light); }

  .dashboard-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 900px) { .dashboard-row { grid-template-columns: 1fr; } }

  .list { display: flex; flex-direction: column; gap: 8px; }
  .list .list-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 8px; background: #fafafa;
  }
  .list .list-item .title { font-weight: 500; }
  .list .list-item .meta { font-size: 12px; color: var(--text-light); }

  /* ===== Table ===== */
  .table-toolbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; gap: 12px; flex-wrap: wrap;
  }
  .table-toolbar .search {
    flex: 1; max-width: 320px;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    outline: none;
  }
  .table-toolbar .search:focus { border-color: var(--primary); }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 16px; border-radius: 8px;
    border: none; cursor: pointer;
    font-size: 13px; font-weight: 500;
    transition: background .15s;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary { background: var(--bg); color: var(--text); }
  .btn-secondary:hover { background: var(--border); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: #b91c1c; }
  .btn-sm { padding: 6px 10px; font-size: 12px; }

  table.data-table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  table.data-table th {
    text-align: left;
    padding: 12px;
    background: #f9fafb;
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    color: var(--text-light);
    border-bottom: 1px solid var(--border);
  }
  table.data-table td {
    padding: 12px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  table.data-table tr:hover td { background: #f9fafb; }
  table.data-table tr:last-child td { border-bottom: none; }

  .actions-cell { display: flex; gap: 6px; }

  /* ===== Modal ===== */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.45);
    display: none; align-items: center; justify-content: center;
    z-index: 200; padding: 20px;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: #fff; border-radius: 12px;
    width: 100%; max-width: 480px;
    max-height: 90vh; overflow-y: auto;
    box-shadow: 0 20px 50px rgba(0,0,0,.2);
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 20px; border-bottom: 1px solid var(--border);
  }
  .modal-header h3 { font-size: 16px; }
  .modal-close {
    background: none; border: none; font-size: 22px;
    cursor: pointer; color: var(--text-light); line-height: 1;
  }
  .modal-body { padding: 20px; }
  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block; margin-bottom: 6px;
    font-size: 13px; font-weight: 500;
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    outline: none;
    font-family: inherit;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus { border-color: var(--primary); }
  .modal-footer {
    display: flex; justify-content: flex-end; gap: 8px;
    padding: 16px 20px; border-top: 1px solid var(--border);
  }

  /* ===== Toast ===== */
  #toast {
    position: fixed; bottom: 24px; right: 24px;
    padding: 12px 18px; border-radius: 8px;
    color: #fff; font-size: 13px; font-weight: 500;
    background: var(--success);
    box-shadow: 0 8px 24px rgba(0,0,0,.15);
    opacity: 0; transform: translateY(12px);
    transition: all .25s ease;
    z-index: 300; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.error { background: var(--danger); }

  /* ===== Empty state ===== */
  .empty-state {
    padding: 40px; text-align: center;
    color: var(--text-light); font-size: 13px;
  }

  /* ===== Dashboard ===== */
  .dashboard { padding: 24px; max-width: 1400px; margin: 0 auto; }

  .dashboard-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .dashboard-header-content h1.dashboard-title {
    margin: 0;
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
  }
  .dashboard-subtitle {
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--text-light);
  }
  .dashboard-actions { display: flex; gap: 8px; }

  /* Stat cards */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
  }
  .stat-card-inner { display: flex; flex-direction: column; }
  .stat-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .stat-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .stat-badge {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-light);
    background: #f9fafb;
    padding: 2px 8px;
    border-radius: 6px;
  }
  .stat-value {
    font-size: 32px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }
  .stat-delta {
    font-size: 12px;
    color: var(--text-light);
    margin-top: 8px;
  }
  .stat-delta-neutral { color: var(--text-light); }

  .stat-card-primary .stat-value { color: var(--primary); }
  .stat-card-info .stat-value { color: #2563eb; }
  .stat-card-success .stat-value { color: var(--success); }
  .stat-card-warning .stat-value { color: var(--warning); }

  /* Charts grid */
  .dashboard-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .chart-card { display: flex; flex-direction: column; }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px;
    border-bottom: 1px solid var(--border);
    background: #f9fafb;
  }
  .card-title-wrap { display: flex; align-items: center; gap: 10px; }
  .card-icon { font-size: 18px; }
  .card-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin: 0;
  }
  .card-subtitle {
    font-size: 12px;
    color: var(--text-light);
    margin: 0;
    margin-left: auto;
  }
  .card-body { padding: 16px; display: flex; flex-direction: column; min-height: 0; }
  .chart-wrapper { position: relative; flex: 1; min-height: 260px; }
  .chart-wrapper canvas { max-height: 100%; }
  .chart-loading {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: var(--card-bg);
    color: var(--text-light);
    gap: 8px;
    z-index: 2;
    border-radius: 10px;
  }
  .btn-loading { opacity: 0.7; pointer-events: none; }

  .list-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .list-item:last-child { border-bottom: none; }
  .list-item-content { flex: 1; }
  .list-item-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin: 0 0 2px;
  }
  .list-item-meta {
    font-size: 12px;
    color: var(--text-light);
    margin: 0;
  }

  /* Responsive */
  @media (max-width: 900px) {
    .dashboard-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
    .dashboard { padding: 16px; }
    .dashboard-header { flex-direction: column; align-items: flex-start; gap: 12px; }
    .dashboard-actions { width: 100%; justify-content: flex-start; }
    .dashboard-actions .btn { flex: 1; justify-content: center; }
  }
</style>
