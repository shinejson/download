<script>
Pages.categories = (function () {
  let records = [];

  function init() {
    document.getElementById('categoriesAddBtn').addEventListener('click', () => openForm());
    const search = document.getElementById('categoriesSearch');
    const filterType = document.getElementById('categoriesFilterType');
    search.addEventListener('input', () => render(search.value, filterType ? filterType.value : 'all'));
    if (filterType) {
      filterType.addEventListener('change', () => render(search.value, filterType.value));
    }
  }

  function updateControls() {
    const addBtn = document.getElementById('categoriesAddBtn');
    if (addBtn) {
      addBtn.style.display = App.can('categories.create') ? '' : 'none';
    }
  }

  function onShow() {
    updateControls();
    load();
  }

  function load() {
    updateControls();
    const wrap = document.getElementById('categoriesTableWrap');
    wrap.innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';
    google.script.run
      .withSuccessHandler(data => { records = data || []; render(); })
      .withFailureHandler(err => {
        wrap.innerHTML = `<div class="empty-state" style="color:var(--danger)">${App.esc(err.message)}</div>`;
      })
      .getCategories();
  }

  function render(filter = '', filterType = 'all') {
    updateControls();
    const wrap = document.getElementById('categoriesTableWrap');
    const q = String(filter || '').trim().toLowerCase();
    const filtered = !q ? records : records.filter(r => {
      const value = String(r['Categories name'] || '').toLowerCase();
      switch (filterType) {
        case 'starts':
          return value.startsWith(q);
        case 'contains':
          return value.includes(q);
        case 'short':
          return value.length > 0 && value.length <= 6;
        case 'long':
          return value.length > 12;
        default:
          return value.includes(q) || String(r['ID'] || '').toLowerCase().includes(q);
      }
    });

    const canEdit = App.can('categories.edit');
    const canDelete = App.can('categories.delete');
    const hasActions = canEdit || canDelete;

    const headers = hasActions
      ? ['ID', 'Categories Name', 'Actions']
      : ['ID', 'Categories Name'];

    App.renderTable(
      wrap,
      headers,
      filtered,
      r => `
        <tr>
          <td><code>${App.esc(r['ID'])}</code></td>
          <td>${App.esc(r['Categories name'])}</td>
          ${hasActions ? `
            <td class="actions-cell">
              ${canEdit ? `<button class="btn btn-secondary btn-sm" data-edit="${App.esc(r['ID'])}">Edit</button>` : ''}
              ${canDelete ? `<button class="btn btn-danger btn-sm" data-del="${App.esc(r['ID'])}">Delete</button>` : ''}
            </td>
          ` : ''}
        </tr>
      `,
      'No categories yet.'
    );

    if (canEdit) {
      wrap.querySelectorAll('[data-edit]').forEach(b => {
        b.onclick = () => openForm(records.find(x => String(x['ID']) === b.dataset.edit));
      });
    }

    if (canDelete) {
      wrap.querySelectorAll('[data-del]').forEach(b => {
        b.onclick = () => remove(b.dataset.del);
      });
    }
  }

  function openForm(record) {
    const isEdit = !!record;
    if (isEdit && !App.can('categories.edit')) {
      App.toast('Permission denied: You cannot edit categories.', 'error');
      return;
    }
    if (!isEdit && !App.can('categories.create')) {
      App.toast('Permission denied: You cannot create categories.', 'error');
      return;
    }

    App.openModal({
      title: isEdit ? 'Edit Category' : 'New Category',
      fields: [
        { name: 'Categories name', label: 'Categories name', value: record ? record['Categories name'] : '' }
      ],
      onSave: (data) => new Promise((resolve, reject) => {
        if (!data['Categories name']) return reject(new Error('Name is required'));
        if (isEdit) {
          google.script.run
            .withSuccessHandler(() => { App.toast('Category updated'); load(); refreshNotifications(); })
            .withFailureHandler(reject)
            .updateCategory(record['ID'], data);
        } else {
          google.script.run
            .withSuccessHandler(() => { App.toast('Category created'); load(); refreshNotifications(); })
            .withFailureHandler(reject)
            .createCategory(data);
        }
      })
    });
  }

  function remove(id) {
    if (!App.can('categories.delete')) {
      App.toast('Permission denied: You cannot delete categories.', 'error');
      return;
    }
    if (!window.confirm('Delete this category?')) return;
    google.script.run
      .withSuccessHandler(() => { App.toast('Category deleted'); load(); refreshNotifications(); })
      .withFailureHandler(err => App.toast(err.message, 'error'))
      .deleteCategory(id);
  }

  return { init, onShow, load };
})();
</script>
