<script>
Pages.settings = (function () {
  let records = [];

  function init() {
    document.getElementById('settingsAddBtn').addEventListener('click', () => openForm());
    const search = document.getElementById('settingsSearch');
    const filterType = document.getElementById('settingsFilterType');
    search.addEventListener('input', (e) => render(e.target.value, filterType ? filterType.value : 'all'));
    if (filterType) {
      filterType.addEventListener('change', () => render(search.value, filterType.value));
    }
  }

  function updateControls() {
    const addBtn = document.getElementById('settingsAddBtn');
    if (addBtn) {
      addBtn.style.display = App.can('settings.edit') ? '' : 'none';
    }
  }

  function onShow() {
    updateControls();
    load();
  }

  function load() {
    updateControls();
    const wrap = document.getElementById('settingsTableWrap');
    wrap.innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';
    google.script.run
      .withSuccessHandler(data => { records = data || []; render(); })
      .withFailureHandler(err => {
        wrap.innerHTML = `<div class="empty-state" style="color:var(--danger)">${App.esc(err.message)}</div>`;
      })
      .getSettings();
  }

  function render(filter = '', filterType = 'all') {
    const wrap = document.getElementById('settingsTableWrap');
    const q = String(filter || '').trim().toLowerCase();
    const filtered = !q && filterType === 'all' ? records : records.filter(r => {
      const key = String(r.key || '').toLowerCase();
      const value = String(r.value || '').toLowerCase();

      if (filterType === 'key') return key.includes(q);
      if (filterType === 'value') return value.includes(q);
      if (filterType === 'starts') return key.startsWith(q) || value.startsWith(q);
      if (filterType === 'contains') return key.includes(q) || value.includes(q);
      return key.includes(q) || value.includes(q);
    });

    const canEdit = App.can('settings.edit');
    const headers = canEdit
      ? ['Key', 'Value', 'Actions']
      : ['Key', 'Value'];

    App.renderTable(
      wrap,
      headers,
      filtered,
      r => `
        <tr>
          <td><code>${App.esc(r.key)}</code></td>
          <td>${App.esc(r.value)}</td>
          ${canEdit ? `
            <td class="actions-cell">
              <button class="btn btn-secondary btn-sm" data-edit="${App.esc(r.key)}">Edit</button>
            </td>
          ` : ''}
        </tr>
      `,
      'No settings yet.'
    );

    if (canEdit) {
      wrap.querySelectorAll('[data-edit]').forEach(b => {
        b.onclick = () => openForm(records.find(x => String(x.key) === b.dataset.edit));
      });
    }
  }

  function openForm(record) {
    if (!App.can('settings.edit')) {
      App.toast('Permission denied: You cannot edit settings.', 'error');
      return;
    }
    const isEdit = !!record;
    App.openModal({
      title: isEdit ? 'Edit Setting' : 'New Setting',
      fields: [
        { name: 'key', label: 'Key', value: record ? record.key : '', readonly: isEdit },
        { name: 'value', label: 'Value', type: 'textarea', value: record ? record.value : '' }
      ],
      onSave: (data) => new Promise((resolve, reject) => {
        if (!data.key) return reject(new Error('Key is required'));
        google.script.run
          .withSuccessHandler(() => { App.toast('Setting saved'); load(); resolve(); })
          .withFailureHandler(reject)
          .saveSetting(data.key, data.value || '');
      })
    });
  }

  return { init, onShow, load };
})();
</script>
