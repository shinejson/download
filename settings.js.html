<script>
var Pages = window.Pages = window.Pages || {};
Pages.settings = (function () {
  let records = [];
  let page = 1;
  let pageSize = 10;
  let searchQuery = '';
  let targetFilter = 'all';
  let sortOrder = 'key_asc';

  function init() {
    const addBtn = document.getElementById('settingsAddBtn');
    if (addBtn) addBtn.addEventListener('click', () => openForm());

    const searchInput = document.getElementById('settingsSearchInput');
    const clearBtn = document.getElementById('settingsSearchClearBtn');
    const targetSelect = document.getElementById('settingsTargetFilter');
    const sortSelect = document.getElementById('settingsSortOrder');
    const resetBtn = document.getElementById('settingsResetFiltersBtn');

    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.trim();
        if (clearBtn) clearBtn.style.display = searchQuery ? 'inline-block' : 'none';
        page = 1;
        render();
      });
    }

    if (clearBtn) {
      clearBtn.addEventListener('click', () => {
        if (searchInput) {
          searchInput.value = '';
          searchInput.focus();
        }
        searchQuery = '';
        clearBtn.style.display = 'none';
        page = 1;
        render();
      });
    }

    if (targetSelect) {
      targetSelect.addEventListener('change', (e) => {
        targetFilter = e.target.value;
        page = 1;
        render();
      });
    }

    if (sortSelect) {
      sortSelect.addEventListener('change', (e) => {
        sortOrder = e.target.value;
        page = 1;
        render();
      });
    }

    if (resetBtn) {
      resetBtn.addEventListener('click', () => {
        searchQuery = '';
        targetFilter = 'all';
        sortOrder = 'key_asc';
        page = 1;

        if (searchInput) searchInput.value = '';
        if (clearBtn) clearBtn.style.display = 'none';
        if (targetSelect) targetSelect.value = 'all';
        if (sortSelect) sortSelect.value = 'key_asc';

        render();
      });
    }
  }

  function updateControls() {
    const addBtn = document.getElementById('settingsAddBtn');
    if (addBtn) {
      addBtn.style.display = App.can('settings.edit') ? '' : 'none';
    }
  }

  function onShow() {
    updateControls();
    load();
  }

  function load() {
    updateControls();
    const wrap = document.getElementById('settingsTableWrap');
    wrap.innerHTML = '<div class="loading"><div class="spinner"></div>Loading settings...</div>';
    google.script.run
      .withSuccessHandler(data => { records = data || []; render(); })
      .withFailureHandler(err => {
        wrap.innerHTML = `<div class="empty-state" style="color:var(--danger)">${App.esc(err.message)}</div>`;
      })
      .getSettings();
  }

  function getFilteredAndSorted() {
    const q = searchQuery.toLowerCase();

    let list = records.filter(r => {
      const key = String(r.key || '').toLowerCase();
      const value = String(r.value || '').toLowerCase();

      if (q) {
        if (targetFilter === 'key') {
          if (!key.includes(q)) return false;
        } else if (targetFilter === 'value') {
          if (!value.includes(q)) return false;
        } else {
          if (!key.includes(q) && !value.includes(q)) return false;
        }
      }

      return true;
    });

    // Sort list
    list.sort((a, b) => {
      const keyA = String(a.key || '').toLowerCase();
      const keyB = String(b.key || '').toLowerCase();

      if (sortOrder === 'key_desc') {
        return keyB.localeCompare(keyA);
      }
      return keyA.localeCompare(keyB);
    });

    return list;
  }

  function render() {
    updateControls();
    const wrap = document.getElementById('settingsTableWrap');
    if (!wrap) return;

    const filtered = getFilteredAndSorted();
    const canEdit = App.can('settings.edit');
    const headers = canEdit
      ? ['Setting Key', 'Value', 'Actions']
      : ['Setting Key', 'Value'];

    App.renderPaginatedTable({
      container: wrap,
      headers: headers,
      rows: filtered,
      page: page,
      pageSize: pageSize,
      emptyMsg: searchQuery
        ? 'No settings match your search.'
        : 'No settings configured yet.',
      onPageChange: (newPage) => {
        page = newPage;
        render();
      },
      onPageSizeChange: (newSize) => {
        pageSize = newSize;
        page = 1;
        render();
      },
      rowRenderer: (r) => `
        <tr>
          <td><code style="font-weight:600;color:var(--primary);">${App.esc(r.key)}</code></td>
          <td style="max-width:320px;word-break:break-word;">${App.esc(r.value)}</td>
          ${canEdit ? `
            <td class="actions-cell">
              <button class="btn btn-secondary btn-sm" data-edit="${App.esc(r.key)}" title="Edit setting"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
            </td>
          ` : ''}
        </tr>
      `
    });

    if (canEdit) {
      wrap.querySelectorAll('[data-edit]').forEach(b => {
        b.onclick = () => openForm(records.find(x => String(x.key) === b.dataset.edit));
      });
    }
  }

  function openForm(record) {
    if (!App.can('settings.edit')) {
      App.toast('Permission denied: You cannot edit settings.', 'error');
      return;
    }
    const isEdit = !!record;
    App.openModal({
      title: isEdit ? 'Edit Setting' : 'New Setting',
      fields: [
        { name: 'key', label: 'Key', value: record ? record.key : '', readonly: isEdit },
        { name: 'value', label: 'Value', type: 'textarea', value: record ? record.value : '' }
      ],
      onSave: (data) => new Promise((resolve, reject) => {
        if (!data.key) return reject(new Error('Key is required'));
        google.script.run
          .withSuccessHandler(() => { App.toast('Setting saved'); load(); resolve(); })
          .withFailureHandler(reject)
          .saveSetting(data.key, data.value || '');
      })
    });
  }

  return { init, onShow, load };
})();
</script>
