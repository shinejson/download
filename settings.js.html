<script>
Pages.settings = (function () {
  let records = [];

  function init() {
    document.getElementById('settingsAddBtn').addEventListener('click', () => openForm());
    document.getElementById('settingsSearch').addEventListener('input', (e) => render(e.target.value));
  }

  function onShow() { load(); }

  function load() {
    const wrap = document.getElementById('settingsTableWrap');
    wrap.innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';
    google.script.run
      .withSuccessHandler(data => { records = data || []; render(); })
      .withFailureHandler(err => {
        wrap.innerHTML = `<div class="empty-state" style="color:var(--danger)">${App.esc(err.message)}</div>`;
      })
      .getSettings();
  }

  function render(filter = '') {
    const wrap = document.getElementById('settingsTableWrap');
    const q = filter.toLowerCase();
    const filtered = !q ? records : records.filter(r =>
      Object.values(r).some(v => String(v).toLowerCase().includes(q))
    );
    App.renderTable(
      wrap,
      ['Key', 'Value', 'Actions'],
      filtered,
      r => `
        <tr>
          <td><code>${App.esc(r.key)}</code></td>
          <td>${App.esc(r.value)}</td>
          <td class="actions-cell">
            <button class="btn btn-secondary btn-sm" data-edit="${App.esc(r.key)}">Edit</button>
          </td>
        </tr>
      `,
      'No settings yet.'
    );
    wrap.querySelectorAll('[data-edit]').forEach(b => {
      b.onclick = () => openForm(records.find(x => String(x.key) === b.dataset.edit));
    });
  }

  function openForm(record) {
    const isEdit = !!record;
    App.openModal({
      title: isEdit ? 'Edit Setting' : 'New Setting',
      fields: [
        { name: 'key', label: 'Key', value: record ? record.key : '', readonly: isEdit },
        { name: 'value', label: 'Value', type: 'textarea', value: record ? record.value : '' }
      ],
      onSave: (data) => new Promise((resolve, reject) => {
        if (!data.key) return reject(new Error('Key is required'));
        google.script.run
          .withSuccessHandler(() => { App.toast('Setting saved'); load(); resolve(); })
          .withFailureHandler(reject)
          .saveSetting(data.key, data.value || '');
      })
    });
  }

  return { init, onShow, load };
})();
</script>
