<script>
var Pages = window.Pages = window.Pages || {};
Pages.settings = (function () {
  let records = [];
  let page = 1;
  let pageSize = 10;
  let searchQuery = '';
  let targetFilter = 'all';
  let sortOrder = 'key_asc';

  function ensurePageMarkup() {
    const pageEl = document.getElementById('page-settings');
    if (!pageEl) return;

    const addBtn = document.getElementById('settingsAddBtn');
    const wrap = document.getElementById('settingsTableWrap');
    const searchInput = document.getElementById('settingsSearchInput');

    if (!addBtn || !wrap || !searchInput) {
      pageEl.innerHTML = `
<div class="card">
  <div class="card-header-bar">
    <h3><i class="fa-solid fa-sliders"></i> Application Settings</h3>
    <button class="btn btn-primary" id="settingsAddBtn" type="button">
      <i class="fa-solid fa-plus"></i> Add Setting
    </button>
  </div>
  <p style="color:var(--text-light); font-size:13px; margin: -6px 0 16px 0;">
    Centralized key/value configuration store for application-wide behavior and parameters.
  </p>

  <div class="advanced-filter-bar">
    <div class="filter-group-main">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" class="search-input" id="settingsSearchInput" placeholder="Search setting keys or values...">
        <button class="search-clear-btn" id="settingsSearchClearBtn" type="button" style="display:none;" title="Clear search" aria-label="Clear search">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>

    <div class="filter-group-controls">
      <label class="filter-control">
        <i class="fa-solid fa-bullseye"></i> Search Target:
        <select class="filter-select" id="settingsTargetFilter" aria-label="Filter target">
          <option value="all">Key &amp; Value</option>
          <option value="key">Key Only</option>
          <option value="value">Value Only</option>
        </select>
      </label>

      <label class="filter-control">
        <i class="fa-solid fa-arrow-down-a-z"></i> Sort:
        <select class="filter-select" id="settingsSortOrder" aria-label="Sort settings">
          <option value="key_asc">Key (A &rarr; Z)</option>
          <option value="key_desc">Key (Z &rarr; A)</option>
        </select>
      </label>

      <button type="button" class="btn btn-secondary btn-sm" id="settingsResetFiltersBtn" title="Reset all filters">
        <i class="fa-solid fa-arrow-rotate-left"></i> Reset
      </button>
    </div>
  </div>

  <div id="settingsTableWrap">
    <div class="loading"><div class="spinner"></div>Loading settings...</div>
  </div>
</div>`;
      bindEvents();
    }
  }

  function bindEvents() {
    const addBtn = document.getElementById('settingsAddBtn');
    if (addBtn) addBtn.onclick = () => openForm();

    const searchInput = document.getElementById('settingsSearchInput');
    const clearBtn = document.getElementById('settingsSearchClearBtn');
    const targetSelect = document.getElementById('settingsTargetFilter');
    const sortSelect = document.getElementById('settingsSortOrder');
    const resetBtn = document.getElementById('settingsResetFiltersBtn');

    if (searchInput) {
      searchInput.oninput = (e) => {
        searchQuery = e.target.value.trim();
        if (clearBtn) clearBtn.style.display = searchQuery ? 'inline-block' : 'none';
        page = 1;
        render();
      };
    }

    if (clearBtn) {
      clearBtn.onclick = () => {
        if (searchInput) {
          searchInput.value = '';
          searchInput.focus();
        }
        searchQuery = '';
        clearBtn.style.display = 'none';
        page = 1;
        render();
      };
    }

    if (targetSelect) {
      targetSelect.onchange = (e) => {
        targetFilter = e.target.value;
        page = 1;
        render();
      };
    }

    if (sortSelect) {
      sortSelect.onchange = (e) => {
        sortOrder = e.target.value;
        page = 1;
        render();
      };
    }

    if (resetBtn) {
      resetBtn.onclick = () => {
        searchQuery = '';
        targetFilter = 'all';
        sortOrder = 'key_asc';
        page = 1;

        if (searchInput) searchInput.value = '';
        if (clearBtn) clearBtn.style.display = 'none';
        if (targetSelect) targetSelect.value = 'all';
        if (sortSelect) sortSelect.value = 'key_asc';

        render();
      };
    }
  }

  function init() {
    ensurePageMarkup();
    bindEvents();
  }

  function updateControls() {
    const addBtn = document.getElementById('settingsAddBtn');
    if (addBtn) {
      addBtn.style.display = App.can('settings.edit') ? '' : 'none';
    }
  }

  function onShow() {
    ensurePageMarkup();
    bindEvents();
    updateControls();
    load();
  }

  function getTableWrap() {
    ensurePageMarkup();
    let wrap = document.getElementById('settingsTableWrap');
    if (!wrap) {
      const pageEl = document.getElementById('page-settings');
      if (pageEl) {
        wrap = pageEl.querySelector('#settingsTableWrap');
      }
    }
    return wrap;
  }

  function load() {
    updateControls();
    const wrap = getTableWrap();
    if (!wrap) return;
    wrap.innerHTML = '<div class="loading"><div class="spinner"></div>Loading settings...</div>';
    google.script.run
      .withSuccessHandler(data => { records = data || []; render(); })
      .withFailureHandler(err => {
        if (wrap) wrap.innerHTML = `<div class="empty-state" style="color:var(--danger)">${App.esc(err.message)}</div>`;
      })
      .getSettings();
  }

  function getFilteredAndSorted() {
    const q = searchQuery.toLowerCase();

    let list = records.filter(r => {
      const key = String(r.key || '').toLowerCase();
      const value = String(r.value || '').toLowerCase();

      if (q) {
        if (targetFilter === 'key') {
          if (!key.includes(q)) return false;
        } else if (targetFilter === 'value') {
          if (!value.includes(q)) return false;
        } else {
          if (!key.includes(q) && !value.includes(q)) return false;
        }
      }

      return true;
    });

    // Sort list
    list.sort((a, b) => {
      const keyA = String(a.key || '').toLowerCase();
      const keyB = String(b.key || '').toLowerCase();

      if (sortOrder === 'key_desc') {
        return keyB.localeCompare(keyA);
      }
      return keyA.localeCompare(keyB);
    });

    return list;
  }

  function render() {
    updateControls();
    const wrap = getTableWrap();
    if (!wrap) return;

    const filtered = getFilteredAndSorted();
    const canEdit = App.can('settings.edit');
    const headers = canEdit
      ? ['Setting Key', 'Value', 'Actions']
      : ['Setting Key', 'Value'];

    App.renderPaginatedTable({
      container: wrap,
      headers: headers,
      rows: filtered,
      page: page,
      pageSize: pageSize,
      emptyMsg: searchQuery
        ? 'No settings match your search.'
        : 'No settings configured yet.',
      onPageChange: (newPage) => {
        page = newPage;
        render();
      },
      onPageSizeChange: (newSize) => {
        pageSize = newSize;
        page = 1;
        render();
      },
      rowRenderer: (r) => `
        <tr>
          <td><code style="font-weight:600;color:var(--primary);">${App.esc(r.key)}</code></td>
          <td style="max-width:320px;word-break:break-word;">${App.esc(r.value)}</td>
          ${canEdit ? `
            <td class="actions-cell">
              <button class="btn btn-secondary btn-sm" data-edit="${App.esc(r.key)}" title="Edit setting"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
            </td>
          ` : ''}
        </tr>
      `
    });

    if (canEdit) {
      wrap.querySelectorAll('[data-edit]').forEach(b => {
        b.onclick = () => openForm(records.find(x => String(x.key) === b.dataset.edit));
      });
    }
  }

  function openForm(record) {
    if (!App.can('settings.edit')) {
      App.toast('Permission denied: You cannot edit settings.', 'error');
      return;
    }
    const isEdit = !!record;
    App.openModal({
      title: isEdit ? 'Edit Setting' : 'New Setting',
      fields: [
        { name: 'key', label: 'Key', value: record ? record.key : '', readonly: isEdit },
        { name: 'value', label: 'Value', type: 'textarea', value: record ? record.value : '' }
      ],
      onSave: (data) => new Promise((resolve, reject) => {
        if (!data.key) return reject(new Error('Key is required'));
        google.script.run
          .withSuccessHandler(() => { App.toast('Setting saved'); load(); resolve(); })
          .withFailureHandler(reject)
          .saveSetting(data.key, data.value || '');
      })
    });
  }

  return { init, onShow, load };
})();
</script>
