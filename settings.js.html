  function switchTab(tabKey) {
    currentTab = tabKey;
    document.querySelectorAll('.settings-tab-btn').forEach(btn => {
      const isMatch = btn.dataset.tab === tabKey;
      btn.classList.toggle('active', isMatch);
      btn.setAttribute('aria-selected', isMatch ? 'true' : 'false');
    });

    document.querySelectorAll('.settings-tab-pane').forEach(pane => {
      pane.classList.toggle('active', pane.id === 'tab-' + tabKey);
    });

    if (tabKey === 'advanced') {
      renderTable();
    }
  }

  function updateLogoPreview(src) {
    const previewImg = document.getElementById('cfgLogoPreviewImg');
    const placeholder = document.getElementById('cfgLogoPlaceholder');
    const removeBtn = document.getElementById('cfgLogoRemoveBtn');
    const logoInput = document.getElementById('cfgCompanyLogo');

    if (src && String(src).trim()) {
      if (previewImg) {
        previewImg.src = src;
        previewImg.style.display = 'block';
      }
      if (placeholder) placeholder.style.display = 'none';
      if (removeBtn) removeBtn.style.display = 'inline-flex';
      if (logoInput && logoInput.value !== src) logoInput.value = src;
    } else {
      if (previewImg) {
        previewImg.src = '';
        previewImg.style.display = 'none';
      }
      if (placeholder) placeholder.style.display = 'block';
      if (removeBtn) removeBtn.style.display = 'none';
      if (logoInput) logoInput.value = '';
    }
  }

  function bindEvents() {
    // 1. Tab Navigation
    document.querySelectorAll('.settings-tab-btn').forEach(btn => {
      btn.onclick = () => switchTab(btn.dataset.tab);
    });

    // 2. Company Logo File Upload (auto-resized via canvas to safe storage dimensions)
    const fileInput = document.getElementById('cfgLogoFileInput');
    if (fileInput) {
      fileInput.onchange = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        if (file.size > 5 * 1024 * 1024) {
          App.toast('Logo image must be under 5MB.', 'error');
          return;
        }
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const maxDim = 280;
            let w = img.width;
            let h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) {
                h = Math.round(h * maxDim / w);
                w = maxDim;
              } else {
                w = Math.round(w * maxDim / h);
                h = maxDim;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const optimizedDataUrl = canvas.toDataURL('image/png');
            updateLogoPreview(optimizedDataUrl);
          };
          img.onerror = () => {
            updateLogoPreview(event.target.result);
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };
    }

    // 3. Company Logo URL input change
    const logoUrlInput = document.getElementById('cfgCompanyLogo');
    if (logoUrlInput) {
      logoUrlInput.oninput = (e) => {
        updateLogoPreview(e.target.value.trim());
      };
    }

    // 4. Logo Remove Button
    const removeLogoBtn = document.getElementById('cfgLogoRemoveBtn');
    if (removeLogoBtn) {
      removeLogoBtn.onclick = () => {
        updateLogoPreview('');
        if (fileInput) fileInput.value = '';
      };
    }

    // 5. Save Company Profile
    const saveCompanyBtn = document.getElementById('btnSaveCompanyProfile');
    if (saveCompanyBtn) {
      saveCompanyBtn.onclick = () => saveCompanyProfile();
    }

    // 6. Save Email Config
    const saveEmailBtn = document.getElementById('btnSaveEmailConfig');
    if (saveEmailBtn) {
      saveEmailBtn.onclick = () => saveEmailConfiguration();
    }

    // 7. Send Test Email
    const testEmailBtn = document.getElementById('btnSendTestEmail');
    if (testEmailBtn) {
      testEmailBtn.onclick = () => sendTestEmailMessage();
    }

    // 8. Save System Setup
    const saveSetupBtn = document.getElementById('btnSaveSystemSetup');
    if (saveSetupBtn) {
      saveSetupBtn.onclick = () => saveSystemConfiguration();
    }

    // 9. Advanced Registry Filters & Actions
    const addBtn = document.getElementById('settingsAddBtn');
    if (addBtn) addBtn.onclick = () => openForm();

    const searchInput = document.getElementById('settingsSearchInput');
    const clearBtn = document.getElementById('settingsSearchClearBtn');
    const targetSelect = document.getElementById('settingsTargetFilter');
    const sortSelect = document.getElementById('settingsSortOrder');
    const resetBtn = document.getElementById('settingsResetFiltersBtn');

    if (searchInput) {
      searchInput.oninput = (e) => {
        searchQuery = e.target.value.trim();
        if (clearBtn) clearBtn.style.display = searchQuery ? 'inline-block' : 'none';
        page = 1;
        renderTable();
      };
    }

    if (clearBtn) {
      clearBtn.onclick = () => {
        if (searchInput) {
          searchInput.value = '';
          searchInput.focus();
        }
        searchQuery = '';
        clearBtn.style.display = 'none';
        page = 1;
        renderTable();
      };
    }

    if (targetSelect) {
      targetSelect.onchange = (e) => {
        targetFilter = e.target.value;
        page = 1;
        renderTable();
      };
    }

    if (sortSelect) {
      sortSelect.onchange = (e) => {
        sortOrder = e.target.value;
        page = 1;
        renderTable();
      };
    }

    if (resetBtn) {
      resetBtn.onclick = () => {
        searchQuery = '';
        targetFilter = 'all';
        sortOrder = 'key_asc';
        page = 1;

        if (searchInput) searchInput.value = '';
        if (clearBtn) clearBtn.style.display = 'none';
        if (targetSelect) targetSelect.value = 'all';
        if (sortSelect) sortSelect.value = 'key_asc';

        renderTable();
      };
    }
  }

  function init() {
    ensurePageMarkup();
    bindEvents();
  }

  function updateControls() {
    const canEdit = App.can('settings.edit');
    const saveCompanyBtn = document.getElementById('btnSaveCompanyProfile');
    const saveEmailBtn = document.getElementById('btnSaveEmailConfig');
    const saveSetupBtn = document.getElementById('btnSaveSystemSetup');
    const addBtn = document.getElementById('settingsAddBtn');

    if (saveCompanyBtn) saveCompanyBtn.style.display = canEdit ? '' : 'none';
    if (saveEmailBtn) saveEmailBtn.style.display = canEdit ? '' : 'none';
    if (saveSetupBtn) saveSetupBtn.style.display = canEdit ? '' : 'none';
    if (addBtn) addBtn.style.display = canEdit ? '' : 'none';
  }

  function onShow() {
    ensurePageMarkup();
    bindEvents();
    updateControls();
    load();
  }

  function getTableWrap() {
    ensurePageMarkup();
    let wrap = document.getElementById('settingsTableWrap');
    if (!wrap) {
      const pageEl = document.getElementById('page-settings');
      if (pageEl) {
        wrap = pageEl.querySelector('#settingsTableWrap');
      }
    }
    return wrap;
  }

  function load() {
    updateControls();
    const wrap = getTableWrap();
    if (wrap) wrap.innerHTML = '<div class="loading"><div class="spinner"></div>Loading configuration store...</div>';

    google.script.run
      .withSuccessHandler(data => {
        records = data || [];
        settingsMap = {};
        records.forEach(r => {
          const k = String(r.key || r.Key || '').trim();
          const v = r.value !== undefined && r.value !== null ? String(r.value) : (r.Value != null ? String(r.Value) : '');
          if (k) {
            settingsMap[k] = v;
            settingsMap[k.toLowerCase()] = v;
            settingsMap[k.toLowerCase().replace(/[^a-z0-9]/g, '_')] = v;
            settingsMap[k.toLowerCase().replace(/[^a-z0-9]/g, '')] = v;
          }
        });

        populateFormFields();
        if (typeof App !== 'undefined' && typeof App.applyBrandSettings === 'function') {
          App.applyBrandSettings(settingsMap);
        }
        renderTable();
      })
      .withFailureHandler(err => {
        if (wrap) wrap.innerHTML = `<div class="empty-state" style="color:var(--danger)">${App.esc(err.message)}</div>`;
      })
      .getSettings();

    // Populate Sheet Database Link
    const sheetId = window.__sheetId__ || (typeof SHEET_ID !== 'undefined' ? SHEET_ID : '');
    const sheetDisplay = document.getElementById('cfgActiveSheetIdDisplay');
    const sheetLink = document.getElementById('cfgOpenSheetLink');
    if (sheetDisplay && sheetId) sheetDisplay.textContent = sheetId;
    if (sheetLink && sheetId) sheetLink.href = 'https://docs.google.com/spreadsheets/d/' + encodeURIComponent(sheetId);
  }

  function populateFormFields() {
    const getVal = (k, fallback = '') => {
      const candidates = [
        k,
        k.toLowerCase(),
        k.toLowerCase().replace(/[^a-z0-9]/g, '_'),
        k.toLowerCase().replace(/[^a-z0-9]/g, ''),
        k.replace(/_/g, ' ')
      ];
      for (let i = 0; i < candidates.length; i++) {
        const val = settingsMap[candidates[i]];
        if (val !== undefined && val !== null && String(val).trim() !== '') {
          return String(val);
        }
      }
      return fallback;
    };

    const setVal = (id, k, fallback = '') => {
      const el = document.getElementById(id);
      if (el) el.value = getVal(k, fallback);
    };

    const setCheck = (id, k, fallback = false) => {
      const el = document.getElementById(id);
      if (el) {
        const val = getVal(k, String(fallback)).toLowerCase();
        el.checked = val === 'true' || val === '1' || val === 'yes';
      }
    };

    // 1. Company Profile
    setVal('cfgCompanyName', 'company_name', 'Conference Records Catering');
    setVal('cfgCompanyTagline', 'company_tagline', '');
    setVal('cfgCompanyPhone', 'company_phone', '');
    setVal('cfgCompanyEmail', 'company_email', '');
    setVal('cfgCompanyAddress', 'company_address', '');
    setVal('cfgCompanyCurrency', 'company_currency', '$');
    setVal('cfgCompanyTaxId', 'company_tax_id', '');
    setVal('cfgCompanyFooterNote', 'company_footer_note', 'All catering orders and weight portions subject to kitchen head chef confirmation.');

    updateLogoPreview(getVal('company_logo', ''));

    // 2. Email Configuration
    setCheck('cfgEmailNotificationsEnabled', 'email_notifications_enabled', false);
    setVal('cfgEmailSenderName', 'email_sender_name', getVal('company_name', 'Conference Management'));
    setVal('cfgEmailSubjectPrefix', 'email_subject_prefix', '[Conference Records]');
    setVal('cfgEmailRecipients', 'email_recipients', '');
    setCheck('cfgNotifyOnCreate', 'email_notify_on_create', true);
    setCheck('cfgNotifyOnEdit', 'email_notify_on_edit', true);
    setCheck('cfgNotifyOnDelete', 'email_notify_on_delete', true);
    setVal('cfgEmailSignature', 'email_signature', 'Automated Kitchen Production System');

    // 3. System Setup
    setVal('cfgAppDisplayName', 'app_display_name', 'Conference Records');
    setVal('cfgSessionTimeoutMins', 'session_timeout_mins', '30');
    setVal('cfgDefaultPageSize', 'default_page_size', '10');
    setVal('cfgDateFormat', 'date_format', 'YYYY-MM-DD');
    setVal('cfgDefaultCategories', 'default_categories', 'STARTER, MAIN DISH, SIDE DISH, DESERT, SIDE ORDERS (A LA CARTE)');

    // Reflect brand name in topbar
    const appBrand = getVal('app_display_name') || getVal('company_name');
    if (appBrand) {
      const topTitle = document.getElementById('topnavTitle');
      if (topTitle && topTitle.textContent === 'Conference Records') {
        topTitle.textContent = appBrand;
      }
    }
  }

  function saveCompanyProfile() {
    if (!App.can('settings.edit')) {
      App.toast('Permission denied: You cannot edit settings.', 'error');
      return;
    }

    const companyName = (document.getElementById('cfgCompanyName') || {}).value || '';
    if (!companyName.trim()) {
      App.toast('Company name is required.', 'error');
      return;
    }

    const btn = document.getElementById('btnSaveCompanyProfile');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';

    const payload = {
      company_name: companyName.trim(),
      company_tagline: ((document.getElementById('cfgCompanyTagline') || {}).value || '').trim(),
      company_logo: ((document.getElementById('cfgCompanyLogo') || {}).value || '').trim(),
      company_phone: ((document.getElementById('cfgCompanyPhone') || {}).value || '').trim(),
      company_email: ((document.getElementById('cfgCompanyEmail') || {}).value || '').trim(),
      company_currency: ((document.getElementById('cfgCompanyCurrency') || {}).value || '$').trim(),
      company_tax_id: ((document.getElementById('cfgCompanyTaxId') || {}).value || '').trim(),
      company_address: ((document.getElementById('cfgCompanyAddress') || {}).value || '').trim(),
      company_footer_note: ((document.getElementById('cfgCompanyFooterNote') || {}).value || '').trim()
    };

    google.script.run
      .withSuccessHandler(() => {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Save Company Profile';
        App.toast('Company profile saved successfully.');
        Object.assign(settingsMap, payload);
        populateFormFields();
        if (typeof App !== 'undefined' && typeof App.applyBrandSettings === 'function') {
          App.applyBrandSettings(payload);
        }
        load();
      })
      .withFailureHandler(err => {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Save Company Profile';
        App.toast(err && err.message ? err.message : 'Failed to save company settings.', 'error');
      })
      .saveSettingsBatch(payload);
  }

  function saveEmailConfiguration() {
    if (!App.can('settings.edit')) {
      App.toast('Permission denied: You cannot edit settings.', 'error');
      return;
    }

    const btn = document.getElementById('btnSaveEmailConfig');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';

    const payload = {
      email_notifications_enabled: String(document.getElementById('cfgEmailNotificationsEnabled').checked),
      email_sender_name: ((document.getElementById('cfgEmailSenderName') || {}).value || '').trim(),
      email_subject_prefix: ((document.getElementById('cfgEmailSubjectPrefix') || {}).value || '').trim(),
      email_recipients: ((document.getElementById('cfgEmailRecipients') || {}).value || '').trim(),
      email_notify_on_create: String(document.getElementById('cfgNotifyOnCreate').checked),
      email_notify_on_edit: String(document.getElementById('cfgNotifyOnEdit').checked),
      email_notify_on_delete: String(document.getElementById('cfgNotifyOnDelete').checked),
      email_signature: ((document.getElementById('cfgEmailSignature') || {}).value || '').trim()
    };

    google.script.run
      .withSuccessHandler(() => {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Save Email Configuration';
        App.toast('Email notification configuration saved.');
        load();
      })
      .withFailureHandler(err => {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Save Email Configuration';
        App.toast(err && err.message ? err.message : 'Failed to save email settings.', 'error');
      })
      .saveSettingsBatch(payload);
  }

  function sendTestEmailMessage() {
    if (!App.can('settings.edit')) {
      App.toast('Permission denied: You cannot test emails.', 'error');
      return;
    }

    const input = document.getElementById('cfgTestEmailRecipient');
    const statusEl = document.getElementById('cfgTestEmailStatus');
    const recipient = input ? input.value.trim() : '';

    if (!recipient || !recipient.includes('@')) {
      App.toast('Please enter a valid recipient email address.', 'error');
      if (input) input.focus();
      return;
    }

    const btn = document.getElementById('btnSendTestEmail');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';

    if (statusEl) {
      statusEl.style.display = 'block';
      statusEl.style.color = '#2563eb';
      statusEl.textContent = 'Connecting to Google Apps Script MailApp service...';
    }

    google.script.run
      .withSuccessHandler((res) => {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Send Test Message';
        if (statusEl) {
          statusEl.style.color = '#16a34a';
          statusEl.textContent = `✓ Verification email successfully sent to ${res.recipient}! Check your inbox.`;
        }
        App.toast('Test email delivered successfully.');
      })
      .withFailureHandler(err => {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Send Test Message';
        if (statusEl) {
          statusEl.style.color = '#dc2626';
          statusEl.textContent = `✗ Failed to send: ${err.message}`;
        }
        App.toast('Test email failed: ' + err.message, 'error');
      })
      .sendTestEmail(recipient);
  }

  function saveSystemConfiguration() {
    if (!App.can('settings.edit')) {
      App.toast('Permission denied: You cannot edit settings.', 'error');
      return;
    }

    const btn = document.getElementById('btnSaveSystemSetup');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';

    const payload = {
      app_display_name: ((document.getElementById('cfgAppDisplayName') || {}).value || '').trim(),
      session_timeout_mins: ((document.getElementById('cfgSessionTimeoutMins') || {}).value || '30').trim(),
      default_page_size: ((document.getElementById('cfgDefaultPageSize') || {}).value || '10').trim(),
      date_format: ((document.getElementById('cfgDateFormat') || {}).value || 'YYYY-MM-DD').trim(),
      default_categories: ((document.getElementById('cfgDefaultCategories') || {}).value || '').trim()
    };

    google.script.run
      .withSuccessHandler(() => {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Save System Setup';
        App.toast('System runtime setup saved.');
        Object.assign(settingsMap, payload);
        populateFormFields();
        if (typeof App !== 'undefined' && typeof App.applyBrandSettings === 'function') {
          App.applyBrandSettings(payload);
        }
        load();
      })
      .withFailureHandler(err => {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Save System Setup';
        App.toast(err && err.message ? err.message : 'Failed to save system setup.', 'error');
      })
      .saveSettingsBatch(payload);
  }

  function getFilteredAndSorted() {
    const q = searchQuery.toLowerCase();

    let list = records.filter(r => {
      const k = String(r.key || '');
      const v = String(r.value !== undefined && r.value !== null ? r.value : '');

      if (q) {
        if (targetFilter === 'key' && !k.toLowerCase().includes(q)) return false;
        if (targetFilter === 'value' && !v.toLowerCase().includes(q)) return false;
        if (targetFilter === 'all' && !k.toLowerCase().includes(q) && !v.toLowerCase().includes(q)) return false;
      }
      return true;
    });

    list.sort((a, b) => {
      const keyA = String(a.key || '').toLowerCase();
      const keyB = String(b.key || '').toLowerCase();
      return sortOrder === 'key_desc' ? keyB.localeCompare(keyA) : keyA.localeCompare(keyB);
    });

    return list;
  }

  function renderTable() {
    updateControls();
    const wrap = getTableWrap();
    if (!wrap) return;

    const filtered = getFilteredAndSorted();
    const canEdit = App.can('settings.edit');
    const headers = canEdit
      ? ['Parameter Key', 'Value', 'Actions']
      : ['Parameter Key', 'Value'];

    App.renderPaginatedTable({
      container: wrap,
      headers: headers,
      rows: filtered,
      page: page,
      pageSize: pageSize,
      emptyMsg: searchQuery || targetFilter !== 'all'
        ? 'No registry settings match your search.'
        : 'No settings configured yet in this spreadsheet.',
      onPageChange: (newPage) => {
        page = newPage;
        renderTable();
      },
      onPageSizeChange: (newSize) => {
        pageSize = newSize;
        page = 1;
        renderTable();
      },
      rowRenderer: (r) => {
        const valStr = String(r.value != null ? r.value : '');
        const isLong = valStr.length > 55;
        const isImage = valStr.startsWith('data:image') || valStr.match(/\.(png|jpg|jpeg|svg|webp)(\?.*)?$/i);

        return `
          <tr>
            <td>
              <code style="font-weight:600;color:#1e3a8a;background:#eff6ff;padding:2px 8px;border-radius:4px;">
                ${App.esc(r.key)}
              </code>
            </td>
            <td>
              ${isImage ? `
                <div style="display:flex;align-items:center;gap:8px;">
                  <img src="${App.esc(valStr)}" style="height:26px;max-width:80px;object-fit:contain;border:1px solid #cbd5e1;border-radius:4px;background:#fff;" alt="preview">
                  <small style="color:var(--text-light);font-size:11px;">(Image / Logo)</small>
                </div>
              ` : `
                <span title="${App.esc(valStr)}" style="display:inline-block;max-width:380px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                  ${App.esc(valStr)}
                </span>
              `}
            </td>
            ${canEdit ? `
              <td class="actions-cell">
                <button class="btn btn-secondary btn-sm" data-edit="${App.esc(r.key)}" title="Edit parameter value">
                  <i class="fa-solid fa-pen-to-square"></i> Edit
                </button>
                <button class="btn btn-danger btn-sm" data-del="${App.esc(r.key)}" title="Delete parameter">
                  <i class="fa-solid fa-trash-can"></i>
                </button>
              </td>
            ` : ''}
          </tr>
        `;
      }
    });

    if (canEdit) {
      wrap.querySelectorAll('[data-edit]').forEach(b => {
        b.onclick = () => openForm(records.find(x => String(x.key) === b.dataset.edit));
      });

      wrap.querySelectorAll('[data-del]').forEach(b => {
        b.onclick = () => remove(b.dataset.del);
      });
    }
  }

  function openForm(record) {
    if (!App.can('settings.edit')) {
      App.toast('Permission denied: You cannot edit settings.', 'error');
      return;
    }
    const isEdit = !!record;
    App.openModal({
      title: isEdit ? 'Edit Setting Parameter' : 'New Setting Parameter',
      fields: [
        {
          name: 'key',
          label: 'Setting Key',
          value: record ? record.key : '',
          type: 'text',
          readonly: isEdit
        },
        {
          name: 'value',
          label: 'Setting Value',
          value: record ? (record.value != null ? record.value : '') : '',
          type: 'textarea'
        }
      ],
      onSave: (data) => new Promise((resolve, reject) => {
        if (!data.key || !String(data.key).trim()) {
          return reject(new Error('Key cannot be empty'));
        }
        google.script.run
          .withSuccessHandler(() => {
            App.toast('Setting saved successfully');
            load();
            resolve();
          })
          .withFailureHandler(reject)
          .saveSetting(data.key.trim(), data.value != null ? String(data.value) : '');
      })
    });
  }

  function remove(key) {
    if (!App.can('settings.edit')) {
      App.toast('Permission denied: You cannot delete settings.', 'error');
      return;
    }
    if (!window.confirm(`Delete configuration parameter "${key}"?`)) return;

    google.script.run
      .withSuccessHandler(() => {
        App.toast('Setting parameter deleted');
        load();
      })
      .withFailureHandler(err => App.toast(err.message, 'error'))
      .deleteSetting(key);
  }

  return { init, onShow, load, switchTab };
})();
</script>
