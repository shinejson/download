<script>
var Pages = window.Pages = window.Pages || {};
var App = window.App = (function () {
  const ROUTES = ['dashboard', 'categories', 'items', 'menu', 'users', 'settings'];
  const TITLES = {
    dashboard: 'Dashboard', categories: 'Categories', items: 'Items',
    menu: 'Menu (Conferences)', users: 'Users', settings: 'Settings'
  };

  let currentPage = 'dashboard';
  let currentUser = null;
  let userPermissions = [];
  const SESSION_TIMEOUT_MS = 30 * 60 * 1000;

  function isStrongPassword(value) {
    if (typeof value !== 'string') return false;
    return /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z\d])(?=.{8,128}$)/.test(value.trim());
  }

  function can(permission) {
    if (!currentUser) return false;
    if (currentUser.role === 'admin') return true;
    return Array.isArray(userPermissions) && userPermissions.includes(permission);
  }

  function canView(page) {
    if (!page || page === 'dashboard') return true;
    return can(page + '.view');
  }

  function refreshSessionTimer() {
    sessionStorage.setItem('conference_records.session', String(Date.now()));
    try {
      google.script.run.withFailureHandler(function () {}).touchSession();
    } catch (e) {}
  }

  function startSessionTimer() {
    const sessionKey = 'conference_records.session';
    const now = Date.now();
    sessionStorage.setItem(sessionKey, String(now));
    window.clearInterval(window.__appSessionTimer__);
    window.__appSessionTimer__ = window.setInterval(function () {
      const last = Number(sessionStorage.getItem(sessionKey) || 0);
      if (!last) return;
      if ((Date.now() - last) > SESSION_TIMEOUT_MS) {
        sessionStorage.removeItem(sessionKey);
        try {
          google.script.run.withFailureHandler(function () {}).logoutUser();
        } catch (e) {}
        window.location.href = (window.__appUrl__ || (window.location.origin + window.location.pathname)) + '?logout=true';
      }
    }, 30000);
  }

  function setTopbarUser(user) {
    const displayName = (user && (user.fullName || user.username)) ? String(user.fullName || user.username).trim() : 'User';
    const username = (user && user.username) ? String(user.username).trim() : 'user';
    const role = (user && user.role) ? String(user.role).toLowerCase() : 'viewer';
    const initial = displayName.charAt(0).toUpperCase() || 'U';

    // Topbar Profile Button / User Chip
    const chipNameEl = document.getElementById('userChipName');
    const chipAvatarEl = document.getElementById('userChipAvatar');
    const chipRoleEl = document.getElementById('userChipRole');

    if (chipNameEl) chipNameEl.textContent = displayName;
    if (chipAvatarEl) chipAvatarEl.textContent = initial;
    if (chipRoleEl) {
      chipRoleEl.textContent = role.toUpperCase();
      chipRoleEl.className = 'role-badge role-' + role;
    }

    // Dropdown Header
    const dropdownAvatarEl = document.getElementById('dropdownAvatar');
    const dropdownFullNameEl = document.getElementById('dropdownFullName');
    const dropdownUsernameEl = document.getElementById('dropdownUsername');
    const dropdownRoleEl = document.getElementById('dropdownRole');

    if (dropdownAvatarEl) dropdownAvatarEl.textContent = initial;
    if (dropdownFullNameEl) dropdownFullNameEl.textContent = displayName;
    if (dropdownUsernameEl) dropdownUsernameEl.textContent = '@' + username;
    if (dropdownRoleEl) {
      dropdownRoleEl.textContent = role.toUpperCase();
      dropdownRoleEl.className = 'role-badge role-' + role;
    }

    // Fallback for legacy .user-chip if present
    const legacyChip = document.querySelector('.user-chip');
    if (legacyChip && !chipNameEl) {
      const name = legacyChip.querySelector('span');
      const avatar = legacyChip.querySelector('.avatar');
      if (name) name.textContent = displayName;
      if (avatar) avatar.textContent = initial;
    }
  }

  function applyRolePermissions() {
    // 1. Hide/show sidebar links based on page view permissions
    document.querySelectorAll('.sidebar-nav a[data-page]').forEach(link => {
      const page = link.dataset.page;
      const allowed = canView(page);
      link.style.display = allowed ? '' : 'none';
    });

    // 2. If current page is unauthorized, route back to dashboard
    if (!canView(currentPage)) {
      toast('Access Denied: You do not have permission to view the ' + (TITLES[currentPage] || currentPage) + ' page.', 'error');
      navigate('dashboard', true);
    } else {
      // Re-trigger onShow to let active page update its buttons
      if (Pages[currentPage] && Pages[currentPage].onShow) {
        try { Pages[currentPage].onShow(); } catch (e) {}
      }
    }
  }

  function loadCurrentUser() {
    google.script.run
      .withSuccessHandler(function (user) {
        currentUser = user || { username: '', fullName: '', role: 'viewer', permissions: [] };
        userPermissions = Array.isArray(currentUser.permissions) ? currentUser.permissions : [];
        setTopbarUser(currentUser);
        applyRolePermissions();
      })
      .withFailureHandler(function (err) {
        console.error('Failed to load user profile:', err);
        currentUser = { username: '', fullName: 'User', role: 'viewer', permissions: [] };
        userPermissions = [];
        setTopbarUser(currentUser);
        applyRolePermissions();
      })
      .getCurrentUserProfile();
  }

  function applyPasswordToggleToFields() {
    document.querySelectorAll('input[type="password"]').forEach(function (field) {
      if (field.dataset.toggleBound === 'true') return;
      const wrapper = document.createElement('div');
      wrapper.className = 'password-toggle-wrap';
      const parent = field.parentNode;
      if (!parent || parent.classList.contains('password-toggle-wrap')) return;
      parent.insertBefore(wrapper, field);
      wrapper.appendChild(field);

      const toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'password-toggle';
      toggle.textContent = 'Show';
      toggle.setAttribute('aria-label', 'Toggle password visibility');
      toggle.addEventListener('click', function () {
        const isHidden = field.type === 'password';
        field.type = isHidden ? 'text' : 'password';
        toggle.textContent = isHidden ? 'Hide' : 'Show';
      });
      wrapper.appendChild(toggle);
      field.dataset.toggleBound = 'true';
    });
  }

  function loadNotifications() {
    const panel = document.getElementById('notificationPanel');
    const list = panel && panel.querySelector('.notification-list');
    const badge = document.querySelector('.notification-badge');
    if (!panel || !list) return;

    google.script.run
      .withSuccessHandler(function (items) {
        const notifications = Array.isArray(items) && items.length ? items : [{
          id: 'empty',
          title: 'No updates',
          message: 'You are all caught up.',
          timeLabel: 'Just now',
          unread: false
        }];

        list.innerHTML = notifications.map(item => `
          <div class="notification-item ${item.unread ? 'unread' : ''}">
            <div class="notification-dot"></div>
            <div>
              <strong>${App.esc(item.title || 'Update')}</strong>
              <div>${App.esc(item.message || '')}</div>
              <small>${App.esc(item.timeLabel || 'Just now')}</small>
            </div>
          </div>
        `).join('');

        const unreadCount = notifications.filter(item => item.unread).length;
        if (badge) {
          badge.textContent = String(unreadCount);
          badge.style.display = unreadCount > 0 ? 'inline-flex' : 'none';
        }
      })
      .withFailureHandler(function () {
        list.innerHTML = `
          <div class="notification-item">
            <div class="notification-dot"></div>
            <div>
              <strong>System alert</strong>
              <div>Unable to load notifications right now.</div>
              <small>Just now</small>
            </div>
          </div>
        `;
        if (badge) {
          badge.textContent = '0';
          badge.style.display = 'none';
        }
      })
      .getNotifications();
  }

  function refreshNotifications() {
    const panel = document.getElementById('notificationPanel');
    const toggle = document.getElementById('notificationToggle');
    if (panel && !panel.classList.contains('hidden')) {
      loadNotifications();
      return;
    }
    if (toggle) {
      const badge = toggle.querySelector('.notification-badge');
      if (badge) {
        badge.style.display = 'inline-flex';
      }
    }
    loadNotifications();
  }

  window.refreshNotifications = refreshNotifications;
  window.loadNotifications = loadNotifications;

  function init(initialPage) {
    window.__appUrl__ = document.body.getAttribute('data-app-url') || (window.location.origin + window.location.pathname);

    const sidebar = document.getElementById('sidebar');
    const main = document.getElementById('main');
    const sidebarToggle = document.getElementById('sidebarToggle');
    const notificationToggle = document.getElementById('notificationToggle');
    const notificationPanel = document.getElementById('notificationPanel');
    const markNotificationsRead = document.getElementById('markNotificationsRead');

    function setSidebarCollapsed(collapsed) {
      const isCollapsed = !!collapsed;
      if (sidebar) sidebar.classList.toggle('hidden', isCollapsed);
      if (main) main.classList.toggle('full', isCollapsed);
      if (sidebarToggle) {
        sidebarToggle.setAttribute('aria-expanded', String(!isCollapsed));
        sidebarToggle.title = isCollapsed ? 'Restore sidebar' : 'Collapse sidebar';
      }
    }

    if (sidebarToggle) {
      sidebarToggle.addEventListener('click', () => {
        const collapsed = sidebar && sidebar.classList.contains('hidden');
        setSidebarCollapsed(!collapsed);
      });
    }

    if (notificationToggle) {
      notificationToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!notificationPanel) return;
        const hidden = notificationPanel.classList.contains('hidden');
        notificationPanel.classList.toggle('hidden', !hidden);
        notificationToggle.setAttribute('aria-expanded', String(hidden));
        if (hidden) loadNotifications();
      });
    }

    if (notificationPanel) {
      document.addEventListener('click', (e) => {
        if (!notificationPanel.contains(e.target) && !notificationToggle.contains(e.target)) {
          notificationPanel.classList.add('hidden');
          if (notificationToggle) notificationToggle.setAttribute('aria-expanded', 'false');
        }
      });
    }

    if (markNotificationsRead) {
      markNotificationsRead.addEventListener('click', () => {
        const badge = document.querySelector('.notification-badge');
        const items = document.querySelectorAll('.notification-item.unread');
        items.forEach(item => item.classList.remove('unread'));
        if (badge) {
          badge.textContent = '0';
          badge.style.display = 'none';
        }
        if (notificationPanel) notificationPanel.classList.add('hidden');
      });
    }

    const notificationIntervalMs = 45 * 1000;
    if (window.__notificationTimer__) clearInterval(window.__notificationTimer__);
    window.__notificationTimer__ = window.setInterval(function () {
      const panelOpen = notificationPanel && !notificationPanel.classList.contains('hidden');
      if (panelOpen || document.visibilityState !== 'hidden') {
        loadNotifications();
      }
    }, notificationIntervalMs);

    loadNotifications();

    // Profile Dropdown Controls
    const profileToggle = document.getElementById('profileToggle');
    const profileDropdown = document.getElementById('profileDropdown');
    const profileDropdownWrapper = document.getElementById('profileDropdownWrapper');
    const profileViewDetailsBtn = document.getElementById('profileViewDetailsBtn');
    const profileSettingsBtn = document.getElementById('profileSettingsBtn');

    if (profileToggle && profileDropdown) {
      profileToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        const isHidden = profileDropdown.classList.contains('hidden');
        profileDropdown.classList.toggle('hidden', !isHidden);
        profileToggle.setAttribute('aria-expanded', String(isHidden));
        // Close notifications panel if open
        if (notificationPanel && !notificationPanel.classList.contains('hidden')) {
          notificationPanel.classList.add('hidden');
          if (notificationToggle) notificationToggle.setAttribute('aria-expanded', 'false');
        }
      });

      document.addEventListener('click', (e) => {
        if (profileDropdownWrapper && !profileDropdownWrapper.contains(e.target)) {
          profileDropdown.classList.add('hidden');
          profileToggle.setAttribute('aria-expanded', 'false');
        }
      });
    }

    if (profileViewDetailsBtn) {
      profileViewDetailsBtn.addEventListener('click', () => {
        if (profileDropdown) {
          profileDropdown.classList.add('hidden');
          if (profileToggle) profileToggle.setAttribute('aria-expanded', 'false');
        }
        showAccountDetailsModal();
      });
    }

    if (profileSettingsBtn) {
      profileSettingsBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if (profileDropdown) {
          profileDropdown.classList.add('hidden');
          if (profileToggle) profileToggle.setAttribute('aria-expanded', 'false');
        }
        navigate('settings');
      });
    }

    document.querySelectorAll('[data-action]').forEach(el => {
      el.addEventListener('click', (e) => {
        const action = el.dataset.action;
        if (action === 'logout') {
          e.preventDefault();
          if (profileDropdown) {
            profileDropdown.classList.add('hidden');
            if (profileToggle) profileToggle.setAttribute('aria-expanded', 'false');
          }
          logout();
        }
        if (action === 'change-password') {
          e.preventDefault();
          if (profileDropdown) {
            profileDropdown.classList.add('hidden');
            if (profileToggle) profileToggle.setAttribute('aria-expanded', 'false');
          }
          openChangePasswordModal();
        }
      });
    });

    document.querySelectorAll('.nav-link').forEach(a => {
      a.addEventListener('click', (e) => {
        if (a.dataset.action) return;
        e.preventDefault();
        const page = a.dataset.page;
        navigate(page);
      });
    });

    window.addEventListener('hashchange', () => {
      const page = (location.hash || '#dashboard').substring(1);
      if (ROUTES.includes(page)) navigate(page, false);
    });

    window.addEventListener('mousemove', refreshSessionTimer);
    window.addEventListener('keydown', refreshSessionTimer);
    window.addEventListener('click', refreshSessionTimer);
    startSessionTimer();
    loadCurrentUser();

    if (Pages.dashboard && typeof Pages.dashboard.init === 'function') Pages.dashboard.init();
    if (Pages.categories && typeof Pages.categories.init === 'function') Pages.categories.init();
    if (Pages.items && typeof Pages.items.init === 'function') Pages.items.init();
    if (Pages.menu && typeof Pages.menu.init === 'function') Pages.menu.init();
    if (Pages.users && typeof Pages.users.init === 'function') Pages.users.init();
    if (Pages.settings && typeof Pages.settings.init === 'function') Pages.settings.init();

    const startPage = ROUTES.includes(initialPage) ? initialPage : 'dashboard';
    navigate(startPage, false);
  }

  function navigate(page, setHash = true) {
    if (!ROUTES.includes(page)) page = 'dashboard';

    // Route guard: check page permission if user profile is loaded
    if (currentUser && !canView(page)) {
      toast('Access Denied: You do not have permission to access the ' + (TITLES[page] || page) + ' page.', 'error');
      if (currentPage !== 'dashboard') {
        navigate('dashboard', true);
      }
      return;
    }

    currentPage = page;

    document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
    const el = document.getElementById('page-' + page);
    if (el) el.classList.add('active');

    document.querySelectorAll('.nav-link').forEach(a => {
      if (!a.dataset.action) a.classList.toggle('active', a.dataset.page === page);
    });

    const titleEl = document.getElementById('topnavTitle');
    if (titleEl) titleEl.textContent = TITLES[page] || page;

    if (setHash && location.hash !== '#' + page) {
      location.hash = page;
    }

    if (Pages[page] && Pages[page].onShow) {
      try { Pages[page].onShow(); } catch (err) { console.error(err); }
    }

    if (window.innerWidth <= 768) {
      const sidebar = document.getElementById('sidebar');
      if (sidebar) sidebar.classList.remove('mobile-open');
    }
  }

  function toast(msg, type = 'success') {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.className = 'show ' + (type === 'error' ? 'error' : '');
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.className = ''; }, 2500);
  }

  function esc(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function fmtDate(d) {
    if (!d) return '';
    try {
      if (d instanceof Date) return d.toISOString().slice(0, 10);
      return String(d).slice(0, 10);
    } catch { return String(d); }
  }

  function logout() {
    if (!window.confirm('Are you sure you want to log out?')) return;
    google.script.run
      .withSuccessHandler(() => {
        sessionStorage.removeItem('conference_records.session');
        window.location.href = (window.__appUrl__ || (window.location.origin + window.location.pathname)) + '?logout=true';
      })
      .withFailureHandler(err => {
        console.error(err);
        toast(err && err.message ? err.message : 'Logout failed', 'error');
      })
      .logoutUser();
  }

  function openChangePasswordModal() {
    google.script.run
      .withSuccessHandler(function (user) {
        const username = (user && user.username) ? user.username : '';
        App.openModal({
          title: 'Change Password',
          fields: [
            { name: 'currentPassword', label: 'Current Password', type: 'password', value: '' },
            { name: 'newPassword', label: 'New Password', type: 'password', value: '' },
            { name: 'confirmPassword', label: 'Confirm New Password', type: 'password', value: '' }
          ],
          onSave: (data) => new Promise((resolve, reject) => {
            const current = String(data.currentPassword || '').trim();
            const next = String(data.newPassword || '').trim();
            const confirm = String(data.confirmPassword || '').trim();

            if (!current) return reject(new Error('Current password is required.'));
            if (!next) return reject(new Error('New password is required.'));
            if (!confirm) return reject(new Error('Please confirm the new password.'));
            if (next !== confirm) return reject(new Error('New password and confirmation do not match.'));
            if (!App.isStrongPassword(next)) return reject(new Error('Password must be 8-128 chars with uppercase, lowercase, number, and symbol.'));

            google.script.run
              .withSuccessHandler(() => {
                App.toast('Password updated successfully.');
                resolve();
              })
              .withFailureHandler(err => reject(err))
              .changePassword(username, current, next);
          })
        });

        setTimeout(() => {
          const modal = document.querySelector('.modal-body');
          if (!modal) return;
          const note = modal.querySelector('.password-policy');
          if (note) return;
          const policy = document.createElement('div');
          policy.className = 'password-policy';
          policy.innerHTML = '<strong>Password policy:</strong> 8-128 chars, at least one uppercase, one lowercase, one number, and one symbol.';
          modal.appendChild(policy);
          applyPasswordToggleToFields();
        }, 0);
      })
      .withFailureHandler(function () {
        App.toast('Unable to load user profile for password change.', 'error');
      })
      .getCurrentUserProfile();
  }

  function showAccountDetailsModal() {
    const user = currentUser || {};
    const displayName = (user.fullName || (user.firstname ? (user.firstname + ' ' + (user.lastname || '')).trim() : user.username)) || 'User';
    const role = String(user.role || 'viewer').toLowerCase();
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop show';
    backdrop.innerHTML = `
      <div class="modal" style="max-width: 520px;">
        <div class="modal-header">
          <h3 style="display:flex;align-items:center;gap:8px;font-size:16px;">
            <i class="fa-solid fa-id-badge" style="color:var(--primary);"></i>
            <span>My Account Details</span>
          </h3>
          <button class="modal-close" type="button" aria-label="Close dialog">&times;</button>
        </div>
        <div class="modal-body" style="padding: 24px;">
          <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);">
            <div class="avatar avatar-lg" style="width:54px;height:54px;font-size:22px;border-radius:50%;background:#e0e7ff;color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;">${esc(displayName.charAt(0).toUpperCase() || 'U')}</div>
            <div>
              <div style="font-size:17px;font-weight:700;color:var(--text);">${esc(displayName)}</div>
              <div style="color:var(--text-light);font-size:13px;margin:2px 0 6px;">@${esc(user.username || 'user')}</div>
              <span class="role-badge role-${esc(role)}">${esc(role.toUpperCase())}</span>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:13px;">
            <div>
              <label style="color:var(--text-light);font-size:11px;font-weight:600;text-transform:uppercase;display:block;margin-bottom:2px;">User ID</label>
              <div style="font-weight:600;"><code>${esc(user.userid || '—')}</code></div>
            </div>
            <div>
              <label style="color:var(--text-light);font-size:11px;font-weight:600;text-transform:uppercase;display:block;margin-bottom:2px;">Status</label>
              <div><span style="display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:#10b98120;color:#10b981;">Active</span></div>
            </div>
            <div>
              <label style="color:var(--text-light);font-size:11px;font-weight:600;text-transform:uppercase;display:block;margin-bottom:2px;">Department</label>
              <div style="font-weight:500;">${esc(user.department || 'General')}</div>
            </div>
            <div>
              <label style="color:var(--text-light);font-size:11px;font-weight:600;text-transform:uppercase;display:block;margin-bottom:2px;">Contact</label>
              <div style="font-weight:500;">${esc(user.contact || '—')}</div>
            </div>
            <div style="grid-column: span 2;">
              <label style="color:var(--text-light);font-size:11px;font-weight:600;text-transform:uppercase;display:block;margin-bottom:2px;">Email Address</label>
              <div style="font-weight:500;">${esc(user.email || '—')}</div>
            </div>
          </div>
        </div>
        <div class="modal-footer" style="display:flex;justify-content:space-between;align-items:center;">
          <button class="btn btn-secondary btn-sm" type="button" id="modalChangePasswordQuickBtn">
            <i class="fa-solid fa-key"></i> Change Password
          </button>
          <button class="btn btn-primary btn-sm" type="button" data-close>Close</button>
        </div>
      </div>
    `;
    document.body.appendChild(backdrop);
    function close() { backdrop.remove(); }
    backdrop.querySelector('.modal-close').onclick = close;
    backdrop.querySelector('[data-close]').onclick = close;
    const cpBtn = backdrop.querySelector('#modalChangePasswordQuickBtn');
    if (cpBtn) {
      cpBtn.onclick = () => {
        close();
        openChangePasswordModal();
      };
    }
  }

  function openModal(opts) {
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop show';
    backdrop.innerHTML = `
      <div class="modal">
        <div class="modal-header">
          <h3>${esc(opts.title)}</h3>
          <button class="modal-close" type="button">&times;</button>
        </div>
        <div class="modal-body">
          <form id="modalForm">
            ${opts.fields.map(f => renderField_(f)).join('')}
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" type="button" data-cancel>Cancel</button>
          <button class="btn btn-primary" type="button" data-save>Save</button>
        </div>
      </div>
    `;
    document.body.appendChild(backdrop);

    function close() { backdrop.remove(); }
    backdrop.querySelector('.modal-close').onclick = close;
    backdrop.querySelector('[data-cancel]').onclick = close;
    backdrop.querySelector('[data-save]').onclick = () => {
      const form = backdrop.querySelector('#modalForm');
      const data = {};
      opts.fields.forEach(f => {
        const input = form.querySelector(`[name="${f.name}"]`);
        if (input) data[f.name] = input.value;
      });
      Promise.resolve(opts.onSave(data))
        .then(() => close())
        .catch(err => {
          App.toast(err.message || 'Error', 'error');
          console.error(err);
        });
    };
    setTimeout(applyPasswordToggleToFields, 0);
    const first = backdrop.querySelector('input, select, textarea');
    if (first) first.focus();
  }

  function renderField_(f) {
    const val = f.value !== undefined ? f.value : '';
    if (f.type === 'select') {
      const opts = (f.options || []).map(o => {
        const v = typeof o === 'string' ? o : o.value;
        const label = typeof o === 'string' ? o : o.label;
        const sel = String(v) === String(val) ? 'selected' : '';
        return `<option value="${esc(v)}" ${sel}>${esc(label)}</option>`;
      }).join('');
      return `<div class="form-group"><label>${esc(f.label)}</label>
        <select name="${esc(f.name)}">${opts}</select></div>`;
    }
    if (f.type === 'textarea') {
      return `<div class="form-group"><label>${esc(f.label)}</label>
        <textarea name="${esc(f.name)}" rows="3">${esc(val)}</textarea></div>`;
    }
    return `<div class="form-group"><label>${esc(f.label)}</label>
      <input type="${esc(f.type || 'text')}" name="${esc(f.name)}" value="${esc(val)}" ${f.readonly ? 'readonly' : ''}></div>`;
  }

  function confirmDelete(msg) {
    return new Promise((resolve) => {
      if (window.confirm(msg || 'Delete this record?')) resolve();
    });
  }

  function renderTable(container, headers, rows, rowRenderer, emptyMsg) {
    if (!rows || rows.length === 0) {
      container.innerHTML = `<div class="empty-state">${esc(emptyMsg || 'No records found.')}</div>`;
      return;
    }
    const thead = '<tr>' + headers.map(h => `<th>${esc(h)}</th>`).join('') + '</tr>';
    const tbody = rows.map((r, i) => rowRenderer(r, i)).join('');
    container.innerHTML = `<div class="table-responsive"><table class="data-table"><thead>${thead}</thead><tbody>${tbody}</tbody></table></div>`;
  }

  function renderPaginatedTable(opts) {
    const container = opts.container;
    const headers = opts.headers || [];
    const rows = Array.isArray(opts.rows) ? opts.rows : [];
    const rowRenderer = opts.rowRenderer;
    const emptyMsg = opts.emptyMsg || 'No records found.';
    const pageSize = Number(opts.pageSize) || 10;
    const total = rows.length;
    const totalPages = Math.max(1, Math.ceil(total / pageSize));
    const page = Math.min(Math.max(1, Number(opts.page) || 1), totalPages);
    const onPageChange = typeof opts.onPageChange === 'function' ? opts.onPageChange : () => {};
    const onPageSizeChange = typeof opts.onPageSizeChange === 'function' ? opts.onPageSizeChange : () => {};

    if (!container) return;

    if (total === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <i class="fa-solid fa-inbox" style="font-size: 28px; color: #94a3b8; display: block; margin-bottom: 8px;"></i>
          ${esc(emptyMsg)}
        </div>
      `;
      return;
    }

    const startIdx = (page - 1) * pageSize;
    const endIdx = Math.min(startIdx + pageSize, total);
    const pageRows = rows.slice(startIdx, endIdx);

    const thead = '<tr>' + headers.map(h => `<th>${esc(h)}</th>`).join('') + '</tr>';
    const tbody = pageRows.map((r, i) => rowRenderer(r, startIdx + i)).join('');

    let pageNumbers = [];
    if (totalPages <= 7) {
      for (let p = 1; p <= totalPages; p++) pageNumbers.push(p);
    } else {
      pageNumbers.push(1);
      if (page > 3) pageNumbers.push('...');
      const start = Math.max(2, page - 1);
      const end = Math.min(totalPages - 1, page + 1);
      for (let p = start; p <= end; p++) {
        pageNumbers.push(p);
      }
      if (page < totalPages - 2) pageNumbers.push('...');
      pageNumbers.push(totalPages);
    }

    const pagesHtml = pageNumbers.map(p => {
      if (p === '...') {
        return '<span class="page-ellipsis">&hellip;</span>';
      }
      return `<button type="button" class="page-btn ${p === page ? 'active' : ''}" data-page="${p}">${p}</button>`;
    }).join('');

    const sizeOptions = [5, 10, 25, 50];
    const sizeOptsHtml = sizeOptions.map(s => `
      <option value="${s}" ${s === pageSize ? 'selected' : ''}>${s}</option>
    `).join('');

    container.innerHTML = `
      <div class="table-responsive">
        <table class="data-table">
          <thead>${thead}</thead>
          <tbody>${tbody}</tbody>
        </table>
      </div>
      <div class="pagination-bar">
        <div class="pagination-info">
          Showing <strong>${startIdx + 1}</strong> to <strong>${endIdx}</strong> of <strong>${total}</strong> records
        </div>
        <div class="pagination-controls">
          <div class="pagination-size">
            <label>Rows per page:
              <select class="pagination-size-select">
                ${sizeOptsHtml}
              </select>
            </label>
          </div>
          <div class="pagination-pages">
            <button type="button" class="page-btn page-prev" ${page <= 1 ? 'disabled' : ''} title="Previous page" aria-label="Previous page">
              <i class="fa-solid fa-chevron-left"></i>
            </button>
            ${pagesHtml}
            <button type="button" class="page-btn page-next" ${page >= totalPages ? 'disabled' : ''} title="Next page" aria-label="Next page">
              <i class="fa-solid fa-chevron-right"></i>
            </button>
          </div>
        </div>
      </div>
    `;

    const sizeSelect = container.querySelector('.pagination-size-select');
    if (sizeSelect) {
      sizeSelect.addEventListener('change', (e) => {
        onPageSizeChange(Number(e.target.value));
      });
    }

    const prevBtn = container.querySelector('.page-prev');
    if (prevBtn && page > 1) {
      prevBtn.addEventListener('click', () => onPageChange(page - 1));
    }

    const nextBtn = container.querySelector('.page-next');
    if (nextBtn && page < totalPages) {
      nextBtn.addEventListener('click', () => onPageChange(page + 1));
    }

    container.querySelectorAll('.pagination-pages button[data-page]').forEach(btn => {
      btn.addEventListener('click', () => {
        const targetPage = Number(btn.dataset.page);
        if (targetPage !== page) {
          onPageChange(targetPage);
        }
      });
    });
  }

  return {
    init, navigate, toast, esc, fmtDate, openModal, confirmDelete, renderTable, renderPaginatedTable,
    isStrongPassword,
    logout, openChangePasswordModal, showAccountDetailsModal, setTopbarUser, loadCurrentUser,
    can, canView, applyRolePermissions,
    loadNotifications, refreshNotifications,
    get currentUser() { return currentUser; },
    get userPermissions() { return userPermissions; },
    get currentPage() { return currentPage; }
  };
})();

window.App = App;
window.Pages = Pages;
</script>
